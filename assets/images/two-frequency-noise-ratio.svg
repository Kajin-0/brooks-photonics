<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Two-frequency photoconductor noise comparison</title>
<desc id="desc">Two illustrative detector noise spectra have similar noise at the higher reference frequency but different noise at the lower comparison frequency. The detector with the stronger low-frequency rise has the larger two-frequency ratio.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="120" y="42" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="500" fill="#241e29">One high-frequency value can hide a low-frequency problem</text>
<text x="120" y="70" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="300" fill="#6f6873">Illustrative noise amplitude spectral density; both detectors are nearly equal at f_H.</text>
