<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Two-frequency photoconductor noise comparison</title>
  <desc id="desc">Linear noise amplitude spectral density comparison from zero to twenty-five nanovolts per root hertz at a lower and higher test frequency for two illustrative photoconductors. Detector A is nearly flat; Detector B is elevated at the lower frequency.</desc>

  <rect width="1000" height="620" fill="#ffffff"/>

  <text x="92" y="38" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2" fill="#6a2e8e">ILLUSTRATIVE TWO-POINT COMPARISON</text>
  <text x="92" y="65" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#655f68">Linear NASD axis: 0–25 nV/√Hz · horizontal frequency spacing is schematic</text>

  <g stroke="#e5e1e7" stroke-width="1">
    <line x1="112" y1="470" x2="760" y2="470"/>
    <line x1="112" y1="396" x2="760" y2="396"/>
    <line x1="112" y1="322" x2="760" y2="322"/>
    <line x1="112" y1="248" x2="760" y2="248"/>
    <line x1="112" y1="174" x2="760" y2="174"/>
    <line x1="112" y1="100" x2="760" y2="100"/>
  </g>

  <g font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6f6873" text-anchor="end">
    <text x="94" y="475">0</text>
    <text x="94" y="401">5</text>
    <text x="94" y="327">10</text>
    <text x="94" y="253">15</text>
    <text x="94" y="179">20</text>
    <text x="94" y="105">25</text>
  </g>

  <line x1="112" y1="86" x2="112" y2="470" stroke="#2f2933" stroke-width="1.6"/>
  <line x1="112" y1="470" x2="760" y2="470" stroke="#2f2933" stroke-width="1.6"/>

  <text transform="rotate(-90 33 278)" x="33" y="278" text-anchor="middle" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="500" fill="#302a34">NASD, eₙ (nV/√Hz)</text>

  <g stroke="#cfc8d3" stroke-width="1.1" stroke-dasharray="5 7">
    <line x1="330" y1="86" x2="330" y2="470"/>
    <line x1="680" y1="86" x2="680" y2="470"/>
  </g>

  <g font-family="STIX Two Math, Cambria Math, Times New Roman, serif" text-anchor="middle">
    <text x="330" y="505" font-size="24" fill="#5b2da8">f<tspan baseline-shift="sub" font-size="14">L</tspan></text>
    <text x="680" y="505" font-size="24" fill="#302a34">f<tspan baseline-shift="sub" font-size="14">H</tspan></text>
  </g>
  <g font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#746d78" text-anchor="middle">
    <text x="330" y="531">example: 1 kHz</text>
    <text x="680" y="531">example: 10 kHz</text>
  </g>
  <text x="444" y="571" text-anchor="middle" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="500" fill="#302a34">Frequency, <tspan font-style="italic">f</tspan> (Hz)</text>

  <!-- Detector B -->
  <path d="M330 182.9 L680 302.8" fill="none" stroke="#6a2e8e" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="330" cy="182.9" r="8" fill="#ffffff" stroke="#6a2e8e" stroke-width="3"/>
  <circle cx="680" cy="302.8" r="8" fill="#ffffff" stroke="#6a2e8e" stroke-width="3"/>
  <text x="298" y="177" text-anchor="end" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#6a2e8e">Detector B</text>
  <text x="350" y="173" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="16" fill="#5b2da8">e<tspan baseline-shift="sub" font-size="10">n</tspan>(f<tspan baseline-shift="sub" font-size="10">L</tspan>) = 19.4</text>
  <text x="700" y="293" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="16" fill="#5b2da8">e<tspan baseline-shift="sub" font-size="10">n</tspan>(f<tspan baseline-shift="sub" font-size="10">H</tspan>) = 11.3</text>

  <!-- Detector A -->
  <path d="M330 310.2 L680 322" fill="none" stroke="#5f5962" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="330" cy="310.2" r="8" fill="#ffffff" stroke="#5f5962" stroke-width="3"/>
  <circle cx="680" cy="322" r="8" fill="#ffffff" stroke="#5f5962" stroke-width="3"/>
  <text x="298" y="305" text-anchor="end" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#4f4953">Detector A</text>
  <text x="350" y="300" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="16" fill="#4f4953">e<tspan baseline-shift="sub" font-size="10">n</tspan>(f<tspan baseline-shift="sub" font-size="10">L</tspan>) = 10.8</text>
  <text x="700" y="344" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="16" fill="#4f4953">e<tspan baseline-shift="sub" font-size="10">n</tspan>(f<tspan baseline-shift="sub" font-size="10">H</tspan>) = 10.0</text>

  <!-- Compact series key -->
  <line x1="800" y1="128" x2="800" y2="334" stroke="#ddd7e1" stroke-width="1"/>
  <line x1="830" y1="164" x2="872" y2="164" stroke="#6a2e8e" stroke-width="4"/>
  <text x="888" y="169" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#6a2e8e">Detector B</text>
  <text x="830" y="201" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="18" fill="#5b2da8">r<tspan baseline-shift="sub" font-size="11">L/H</tspan> = 1.72</text>
  <line x1="830" y1="256" x2="872" y2="256" stroke="#5f5962" stroke-width="3.6"/>
  <text x="888" y="261" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#4f4953">Detector A</text>
  <text x="830" y="293" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="18" fill="#4f4953">r<tspan baseline-shift="sub" font-size="11">L/H</tspan> = 1.08</text>

  <line x1="112" y1="596" x2="954" y2="596" stroke="#ded9e1" stroke-width="1"/>
  <text x="112" y="614" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#746d78">Only the two measured frequencies are shown; connecting segments are guides to the eye, not a fitted spectrum.</text>
</svg>
