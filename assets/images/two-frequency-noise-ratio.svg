<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
  <title id="title">Two-frequency photoconductor noise comparison</title>
  <desc id="desc">A professional two-point comparison of noise amplitude spectral density for two illustrative photoconductors. The NASD axis is linear and begins at zero. The horizontal positions identify a lower test frequency and a higher reference frequency.</desc>

  <rect width="1000" height="590" fill="#ffffff"/>

  <text x="92" y="38" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2" fill="#6a2e8e">ILLUSTRATIVE TWO-POINT COMPARISON</text>
  <text x="92" y="65" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#655f68">Linear NASD axis; horizontal frequency spacing is schematic</text>

  <g stroke="#e5e1e7" stroke-width="1">
    <line x1="112" y1="430" x2="754" y2="430"/>
    <line x1="112" y1="345" x2="754" y2="345"/>
    <line x1="112" y1="260" x2="754" y2="260"/>
    <line x1="112" y1="175" x2="754" y2="175"/>
    <line x1="112" y1="90" x2="754" y2="90"/>
  </g>

  <g font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6f6873" text-anchor="end">
    <text x="94" y="435">0</text>
    <text x="94" y="350">5</text>
    <text x="94" y="265">10</text>
    <text x="94" y="180">15</text>
    <text x="94" y="95">20</text>
  </g>

  <line x1="112" y1="76" x2="112" y2="430" stroke="#2f2933" stroke-width="1.6"/>
  <line x1="112" y1="430" x2="754" y2="430" stroke="#2f2933" stroke-width="1.6"/>

  <text transform="rotate(-90 34 255)" x="34" y="255" text-anchor="middle" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="500" fill="#302a34">NASD (nV/√Hz)</text>

  <g stroke="#cfc8d3" stroke-width="1.1" stroke-dasharray="5 7">
    <line x1="330" y1="76" x2="330" y2="430"/>
    <line x1="664" y1="76" x2="664" y2="430"/>
  </g>

  <g font-family="STIX Two Math, Cambria Math, Times New Roman, serif" text-anchor="middle">
    <text x="330" y="462" font-size="24" fill="#5b2da8">f<tspan baseline-shift="sub" font-size="14">L</tspan></text>
    <text x="664" y="462" font-size="24" fill="#302a34">f<tspan baseline-shift="sub" font-size="14">H</tspan></text>
  </g>
  <g font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#746d78" text-anchor="middle">
    <text x="330" y="488">example: 1 kHz</text>
    <text x="664" y="488">example: 10 kHz</text>
  </g>
  <text x="438" y="530" text-anchor="middle" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="500" fill="#302a34">Frequency, <tspan font-style="italic">f</tspan> (Hz)</text>

  <path d="M330 100.2 L664 237.9" fill="none" stroke="#6a2e8e" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="330" cy="100.2" r="8" fill="#ffffff" stroke="#6a2e8e" stroke-width="3"/>
  <circle cx="664" cy="237.9" r="8" fill="#ffffff" stroke="#6a2e8e" stroke-width="3"/>

  <text x="298" y="95" text-anchor="end" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#6a2e8e">Detector B</text>
  <text x="350" y="91" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="16" fill="#5b2da8">e<tspan baseline-shift="sub" font-size="10">n</tspan>(f<tspan baseline-shift="sub" font-size="10">L</tspan>) = 19.4</text>
  <text x="684" y="228" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="16" fill="#5b2da8">e<tspan baseline-shift="sub" font-size="10">n</tspan>(f<tspan baseline-shift="sub" font-size="10">H</tspan>) = 11.3</text>

  <path d="M330 246.4 L664 260" fill="none" stroke="#5f5962" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="330" cy="246.4" r="8" fill="#ffffff" stroke="#5f5962" stroke-width="3"/>
  <circle cx="664" cy="260" r="8" fill="#ffffff" stroke="#5f5962" stroke-width="3"/>

  <text x="298" y="241" text-anchor="end" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#4f4953">Detector A</text>
  <text x="350" y="236" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="16" fill="#4f4953">e<tspan baseline-shift="sub" font-size="10">n</tspan>(f<tspan baseline-shift="sub" font-size="10">L</tspan>) = 10.8</text>
  <text x="684" y="282" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="16" fill="#4f4953">e<tspan baseline-shift="sub" font-size="10">n</tspan>(f<tspan baseline-shift="sub" font-size="10">H</tspan>) = 10.0</text>

  <line x1="786" y1="108" x2="786" y2="326" stroke="#ddd7e1" stroke-width="1"/>

  <line x1="816" y1="146" x2="858" y2="146" stroke="#6a2e8e" stroke-width="4"/>
  <text x="874" y="151" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#6a2e8e">Detector B</text>
  <text x="816" y="181" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="18" fill="#5b2da8">r<tspan baseline-shift="sub" font-size="11">L/H</tspan> = 1.72</text>

  <line x1="816" y1="244" x2="858" y2="244" stroke="#5f5962" stroke-width="3.6"/>
  <text x="874" y="249" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#4f4953">Detector A</text>
  <text x="816" y="279" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="18" fill="#4f4953">r<tspan baseline-shift="sub" font-size="11">L/H</tspan> = 1.08</text>

  <line x1="112" y1="555" x2="954" y2="555" stroke="#ded9e1" stroke-width="1"/>
  <text x="112" y="578" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#746d78">Only the two measured frequencies are shown; connecting segments are guides to the eye, not a fitted spectrum.</text>
</svg>