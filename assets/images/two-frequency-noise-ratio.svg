<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Two-frequency photoconductor noise comparison</title>
  <desc id="desc">Two illustrative detector noise spectra have similar noise at the higher reference frequency but different noise at the lower comparison frequency. The detector with the stronger low-frequency rise has the larger two-frequency ratio.</desc>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="120" y="42" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="500" fill="#241e29">One high-frequency value can hide a low-frequency problem</text>
  <text x="120" y="70" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="300" fill="#6f6873">Illustrative noise amplitude spectral density; both detectors are nearly equal at f_H.</text>

  <rect x="368" y="95" width="495" height="505" fill="#f7f3fb"/>

  <g stroke="#e6e1e9" stroke-width="1">
    <line x1="120" y1="554" x2="1110" y2="554"/>
    <line x1="120" y1="439" x2="1110" y2="439"/>
    <line x1="120" y1="325" x2="1110" y2="325"/>
    <line x1="120" y1="210" x2="1110" y2="210"/>
    <line x1="120" y1="95" x2="1110" y2="95"/>
  </g>
  <g fill="#766f7b" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="13" text-anchor="end">
    <text x="102" y="559">10</text><text x="102" y="444">15</text><text x="102" y="330">20</text><text x="102" y="215">25</text><text x="102" y="100">30</text>
  </g>

  <g stroke="#eeeaf0" stroke-width="1">
    <line x1="120" y1="95" x2="120" y2="600"/>
    <line x1="368" y1="95" x2="368" y2="600"/>
    <line x1="604" y1="95" x2="604" y2="600"/>
    <line x1="863" y1="95" x2="863" y2="600"/>
    <line x1="1110" y1="95" x2="1110" y2="600"/>
  </g>
  <g fill="#766f7b" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="13" text-anchor="middle">
    <text x="120" y="634">300 Hz</text><text x="368" y="634">1 kHz</text><text x="604" y="634">3 kHz</text><text x="863" y="634">10 kHz</text><text x="1110" y="634">30 kHz</text>
  </g>

  <line x1="120" y1="600" x2="1110" y2="600" stroke="#332c38" stroke-width="1.6"/>
  <line x1="120" y1="95" x2="120" y2="600" stroke="#332c38" stroke-width="1.6"/>
  <text x="615" y="692" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#514a55">Frequency</text>
  <text transform="rotate(-90 30 347.5)" x="30" y="347.5" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#514a55">Noise ASD (nV/√Hz)</text>

  <line x1="368" y1="95" x2="368" y2="600" stroke="#6f3ec6" stroke-width="2" stroke-dasharray="8 7"/>
  <line x1="863" y1="95" x2="863" y2="600" stroke="#3a333f" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="330" y="109" width="76" height="29" rx="14.5" fill="#6f3ec6"/>
  <text x="368" y="129" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">f<tspan baseline-shift="sub" font-size="10">L</tspan></text>
  <rect x="825" y="109" width="76" height="29" rx="14.5" fill="#3a333f"/>
  <text x="863" y="129" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">f<tspan baseline-shift="sub" font-size="10">H</tspan></text>

  <path d="M120 510 C300 523 455 544 620 558 C790 566 950 569 1110 569" fill="none" stroke="#635c66" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M120 183 C240 244 315 304 368 338 C500 425 640 508 760 537 C803 545 837 547 863 548 C960 551 1032 552 1110 553" fill="none" stroke="#6f3ec6" stroke-width="4" stroke-linecap="round"/>

  <circle cx="368" cy="538" r="6" fill="#fff" stroke="#635c66" stroke-width="3"/>
  <circle cx="863" cy="568" r="6" fill="#fff" stroke="#635c66" stroke-width="3"/>
  <circle cx="368" cy="338" r="6" fill="#fff" stroke="#6f3ec6" stroke-width="3"/>
  <circle cx="863" cy="548" r="6" fill="#fff" stroke="#6f3ec6" stroke-width="3"/>

  <text x="198" y="205" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#6f3ec6">Detector B</text>
  <text x="198" y="540" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#635c66">Detector A</text>

  <rect x="840" y="165" width="236" height="126" rx="8" fill="#fff" stroke="#d9d2de"/>
  <text x="862" y="195" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#4d4651">Two-frequency ratio</text>
  <text x="862" y="231" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#635c66">Detector A</text>
  <text x="1058" y="231" text-anchor="end" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#635c66">1.08</text>
  <text x="862" y="269" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#6f3ec6">Detector B</text>
  <text x="1058" y="269" text-anchor="end" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#6f3ec6">1.72</text>

  <path d="M305 315 C330 290 357 290 384 316" fill="none" stroke="#6f3ec6" stroke-width="1.5"/>
  <text x="392" y="320" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#6f3ec6">Stronger low-frequency rise</text>
  <text x="615" y="582" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#6a6170">same comparison interval</text>
</svg>