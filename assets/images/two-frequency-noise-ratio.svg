<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Two-frequency photoconductor noise comparison</title>
  <desc id="desc">A linear two-point comparison of noise amplitude spectral density at a lower and higher frequency for two illustrative detectors. Detector A is nearly flat. Detector B is elevated at the lower frequency. Ratios are labeled beside the higher-frequency points.</desc>

  <rect width="1000" height="520" fill="#ffffff"/>

  <text x="96" y="44" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#514a55">NASD (nV/√Hz)</text>

  <g font-family="STIX Two Math, Cambria Math, Times New Roman, serif" text-anchor="middle">
    <text x="330" y="49" font-size="24" fill="#5b2da8">f<tspan baseline-shift="sub" font-size="14">L</tspan></text>
    <text x="620" y="49" font-size="24" fill="#332c38">f<tspan baseline-shift="sub" font-size="14">H</tspan></text>
  </g>
  <g font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#746d78" text-anchor="middle">
    <text x="330" y="72">lower comparison · example 1 kHz</text>
    <text x="620" y="72">higher reference · example 10 kHz</text>
  </g>

  <g stroke="#e6e2e8" stroke-width="1">
    <line x1="96" y1="430" x2="680" y2="430"/>
    <line x1="96" y1="347.5" x2="680" y2="347.5"/>
    <line x1="96" y1="265" x2="680" y2="265"/>
    <line x1="96" y1="182.5" x2="680" y2="182.5"/>
    <line x1="96" y1="100" x2="680" y2="100"/>
  </g>

  <g font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#746d78" text-anchor="end">
    <text x="80" y="435">0</text>
    <text x="80" y="352.5">5</text>
    <text x="80" y="270">10</text>
    <text x="80" y="187.5">15</text>
    <text x="80" y="105">20</text>
  </g>

  <line x1="96" y1="84" x2="96" y2="430" stroke="#332c38" stroke-width="1.5"/>
  <line x1="96" y1="430" x2="680" y2="430" stroke="#332c38" stroke-width="1.5"/>

  <g stroke="#d4ced8" stroke-width="1.1" stroke-dasharray="5 7">
    <line x1="330" y1="84" x2="330" y2="430"/>
    <line x1="620" y1="84" x2="620" y2="430"/>
  </g>

  <path d="M330 110 L620 243.5" fill="none" stroke="#6a2e8e" stroke-width="4" stroke-linecap="round"/>
  <circle cx="330" cy="110" r="7" fill="#ffffff" stroke="#6a2e8e" stroke-width="3"/>
  <circle cx="620" cy="243.5" r="7" fill="#ffffff" stroke="#6a2e8e" stroke-width="3"/>

  <text x="302" y="105" text-anchor="end" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#6a2e8e">Detector B</text>
  <text x="350" y="105" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="500" fill="#6a2e8e">19.4</text>

  <path d="M620 243.5 L698 211" fill="none" stroke="#bca9ca" stroke-width="1.2"/>
  <text x="716" y="205" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#6a2e8e">Detector B</text>
  <text x="900" y="205" text-anchor="end" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="500" fill="#6a2e8e">11.3</text>
  <text x="716" y="229" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="17" fill="#5b2da8">r<tspan baseline-shift="sub" font-size="10">L/H</tspan> = 1.72</text>

  <path d="M330 251.8 L620 265" fill="none" stroke="#625c66" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="330" cy="251.8" r="7" fill="#ffffff" stroke="#625c66" stroke-width="3"/>
  <circle cx="620" cy="265" r="7" fill="#ffffff" stroke="#625c66" stroke-width="3"/>

  <text x="302" y="247" text-anchor="end" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#514a55">Detector A</text>
  <text x="350" y="247" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="500" fill="#514a55">10.8</text>

  <path d="M620 265 L698 309" fill="none" stroke="#c7c1ca" stroke-width="1.2"/>
  <text x="716" y="304" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#514a55">Detector A</text>
  <text x="900" y="304" text-anchor="end" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="500" fill="#514a55">10.0</text>
  <text x="716" y="328" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="17" fill="#4f4852">r<tspan baseline-shift="sub" font-size="10">L/H</tspan> = 1.08</text>

  <line x1="704" y1="168" x2="704" y2="350" stroke="#e2dde5" stroke-width="1"/>
  <text x="716" y="379" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#746d78">Direct labels replace floating callout boxes.</text>
  <text x="716" y="399" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#746d78">Only the measured points are shown.</text>
</svg>