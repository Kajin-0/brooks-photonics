<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Equivalent noise bandwidth as an equal-area brick-wall filter</title>
  <desc id="desc">The area under a real low-pass power response equals the area of an ideal rectangular filter whose width is the equivalent noise bandwidth.</desc>
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2c2237">Equivalent noise bandwidth: equal transmitted noise power</text>

  <line x1="92" y1="326" x2="708" y2="326" stroke="#2c2237" stroke-width="2"/>
  <line x1="92" y1="76" x2="92" y2="326" stroke="#2c2237" stroke-width="2"/>

  <path d="M92 100 C155 102 198 119 240 157 C301 212 414 270 696 307 L696 326 L92 326 Z" fill="#6f3ec6" fill-opacity="0.18"/>
  <path d="M92 100 C155 102 198 119 240 157 C301 212 414 270 696 307" fill="none" stroke="#6f3ec6" stroke-width="4"/>

  <path d="M92 326 L92 100 L344 100 L344 326" fill="#f3eefb" fill-opacity="0.55" stroke="#2c2237" stroke-width="3" stroke-dasharray="10 7"/>
  <line x1="240" y1="84" x2="240" y2="326" stroke="#867793" stroke-width="2" stroke-dasharray="6 6"/>

  <rect x="470" y="86" width="205" height="72" rx="6" fill="#ffffff" stroke="#d8d1e2"/>
  <line x1="488" y1="108" x2="530" y2="108" stroke="#6f3ec6" stroke-width="4"/>
  <text x="540" y="113" font-family="Arial, sans-serif" font-size="15" fill="#2c2237">real |H(f)|²</text>
  <line x1="488" y1="137" x2="530" y2="137" stroke="#2c2237" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="540" y="142" font-family="Arial, sans-serif" font-size="15" fill="#2c2237">equal-area rectangle</text>

  <text x="240" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#2c2237">f<tspan baseline-shift="sub" font-size="11">−3 dB</tspan></text>
  <text x="344" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#6f3ec6">ENBW</text>
  <text x="400" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#2c2237">Frequency</text>
  <text transform="rotate(-90 30 205)" x="30" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#2c2237">Normalized power response |H(f)|²</text>

  <text x="218" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2c2237">same area</text>
  <path d="M205 214 C190 235 176 252 160 267" fill="none" stroke="#2c2237" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M230 214 C248 235 266 252 286 268" fill="none" stroke="#2c2237" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2c2237"/></marker>
  </defs>
</svg>
