<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="mct-noise-title mct-noise-desc">
<title id="mct-noise-title">Representative HgCdTe photoconductor noise amplitude spectral density</title>
<desc id="mct-noise-desc">A log-log MCT noise model with a blue total-noise curve, green 1 to 10 kilohertz test band, magenta generation-recombination corner guides, and labeled one-over-f, generation-recombination, and Johnson regions.</desc>
<rect width="1100" height="720" fill="#ffffff"/>
<defs>
  <clipPath id="plot-clip"><rect x="100" y="112" width="940" height="498"/></clipPath>
  <pattern id="green-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><line x1="0" y1="0" x2="0" y2="12" stroke="#4e9f50" stroke-width="2" opacity=".42"/></pattern>
</defs>
<style>
text{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202124}.axis{stroke:#202124;stroke-width:1.5}.major{stroke:#9fa5ab;stroke-width:1;stroke-dasharray:5 4;opacity:.62}.minor{stroke:#b9bec3;stroke-width:.75;stroke-dasharray:3 4;opacity:.48}.tick{font-size:13px}.axis-label{font-size:16px}.region{font-size:19px;font-weight:700}.formula{font-size:15px}.note{font-size:12.5px;fill:#6c7278}.model{font-size:15px}.legend{font-size:14px}
</style>
<text x="550" y="34" text-anchor="middle" font-size="22" font-weight="700">Representative MCT noise amplitude spectral density</text>
<rect x="112" y="50" width="916" height="45" rx="6" fill="#f7f8fa" stroke="#d5d9dd"/>
<text class="model" x="570" y="70" text-anchor="middle">eₙ(f) = [(4.5×10⁻⁵ f⁻¹·¹⁵)² + (2.0×10⁻⁷ / √(1+(f/1.7×10⁵)²))² + (2.0×10⁻⁸)²]¹ᐟ²</text>
<text class="note" x="570" y="88" text-anchor="middle">Illustrative fit parameters; f in Hz and eₙ in V/√Hz</text>

<g clip-path="url(#plot-clip)">
  <rect x="256.7" y="250" width="156.6" height="360" fill="#b8dfb1" opacity=".62"/>
  <rect x="256.7" y="250" width="156.6" height="360" fill="url(#green-hatch)"/>

  <g>
    <line class="major" x1="100" y1="112" x2="100" y2="610"/><line class="major" x1="256.7" y1="112" x2="256.7" y2="610"/><line class="major" x1="413.3" y1="112" x2="413.3" y2="610"/><line class="major" x1="570" y1="112" x2="570" y2="610"/><line class="major" x1="726.7" y1="112" x2="726.7" y2="610"/><line class="major" x1="883.3" y1="112" x2="883.3" y2="610"/><line class="major" x1="1040" y1="112" x2="1040" y2="610"/>
    <line class="minor" x1="147.2" y1="112" x2="147.2" y2="610"/><line class="minor" x1="174.8" y1="112" x2="174.8" y2="610"/><line class="minor" x1="209.5" y1="112" x2="209.5" y2="610"/>
    <line class="minor" x1="303.9" y1="112" x2="303.9" y2="610"/><line class="minor" x1="331.5" y1="112" x2="331.5" y2="610"/><line class="minor" x1="366.2" y1="112" x2="366.2" y2="610"/>
    <line class="minor" x1="460.5" y1="112" x2="460.5" y2="610"/><line class="minor" x1="488.1" y1="112" x2="488.1" y2="610"/><line class="minor" x1="522.8" y1="112" x2="522.8" y2="610"/>
    <line class="minor" x1="617.2" y1="112" x2="617.2" y2="610"/><line class="minor" x1="644.8" y1="112" x2="644.8" y2="610"/><line class="minor" x1="679.5" y1="112" x2="679.5" y2="610"/>
    <line class="minor" x1="773.9" y1="112" x2="773.9" y2="610"/><line class="minor" x1="801.5" y1="112" x2="801.5" y2="610"/><line class="minor" x1="836.2" y1="112" x2="836.2" y2="610"/>
    <line class="minor" x1="930.5" y1="112" x2="930.5" y2="610"/><line class="minor" x1="958.1" y1="112" x2="958.1" y2="610"/><line class="minor" x1="992.8" y1="112" x2="992.8" y2="610"/>
    <line class="major" x1="100" y1="112" x2="1040" y2="112"/><line class="major" x1="100" y1="361" x2="1040" y2="361"/><line class="major" x1="100" y1="610" x2="1040" y2="610"/>
    <line class="minor" x1="100" y1="187" x2="1040" y2="187"/><line class="minor" x1="100" y1="231" x2="1040" y2="231"/><line class="minor" x1="100" y1="286" x2="1040" y2="286"/>
    <line class="minor" x1="100" y1="436" x2="1040" y2="436"/><line class="minor" x1="100" y1="480" x2="1040" y2="480"/><line class="minor" x1="100" y1="535" x2="1040" y2="535"/>
  </g>

  <path d="M100 160 C130 218 166 254 220 270 C274 285 350 286 430 287 C510 288 565 291 607 333 C651 378 694 444 754 493 C817 544 895 564 1040 566" fill="none" stroke="#1747d1" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="100" y1="333" x2="607" y2="333" stroke="#d100d1" stroke-width="1.8" stroke-dasharray="8 6"/>
  <line x1="607" y1="333" x2="607" y2="610" stroke="#d100d1" stroke-width="1.8" stroke-dasharray="8 6"/>
  <circle cx="607" cy="333" r="7" fill="#d100d1"/>
</g>

<line class="axis" x1="100" y1="610" x2="1040" y2="610"/><line class="axis" x1="100" y1="112" x2="100" y2="610"/>
<g class="tick">
  <text x="100" y="636" text-anchor="middle">10<tspan baseline-shift="super" font-size="10">2</tspan></text><text x="256.7" y="636" text-anchor="middle">10<tspan baseline-shift="super" font-size="10">3</tspan></text><text x="413.3" y="636" text-anchor="middle">10<tspan baseline-shift="super" font-size="10">4</tspan></text><text x="570" y="636" text-anchor="middle">10<tspan baseline-shift="super" font-size="10">5</tspan></text><text x="726.7" y="636" text-anchor="middle">10<tspan baseline-shift="super" font-size="10">6</tspan></text><text x="883.3" y="636" text-anchor="middle">10<tspan baseline-shift="super" font-size="10">7</tspan></text><text x="1040" y="636" text-anchor="middle">10<tspan baseline-shift="super" font-size="10">8</tspan></text>
  <text x="83" y="117" text-anchor="end">10<tspan baseline-shift="super" font-size="10">−6</tspan></text><text x="83" y="366" text-anchor="end">10<tspan baseline-shift="super" font-size="10">−7</tspan></text><text x="83" y="615" text-anchor="end">10<tspan baseline-shift="super" font-size="10">−8</tspan></text>
</g>

<text class="region" x="190" y="205">1/f region</text>
<text class="formula" x="190" y="230">e<tspan baseline-shift="sub" font-size="12">1/f</tspan> ∝ f<tspan baseline-shift="super" font-size="12">−1.15</tspan></text>
<text class="region" x="675" y="285">GR region</text>
<text class="formula" x="675" y="310">e<tspan baseline-shift="sub" font-size="12">GR</tspan> = e<tspan baseline-shift="sub" font-size="12">GR,0</tspan> / √(1+(f/f<tspan baseline-shift="sub" font-size="12">c</tspan>)²)</text>
<text class="region" x="855" y="505">Johnson region</text>
<text class="formula" x="855" y="530">e<tspan baseline-shift="sub" font-size="12">J</tspan> = √(4k<tspan baseline-shift="sub" font-size="12">B</tspan>TR)</text>

<text x="335" y="589" text-anchor="middle" font-size="14" font-weight="650" fill="#2d7d32">typical 1–10 kHz test band</text>
<text x="568" y="388" text-anchor="end" font-size="14" fill="#d100d1">τ<tspan baseline-shift="sub" font-size="11">eff</tspan> = 1/(2πf<tspan baseline-shift="sub" font-size="11">c</tspan>)</text>
<text x="621" y="356" font-size="14" fill="#d100d1">f<tspan baseline-shift="sub" font-size="11">c</tspan> = 1.7 × 10<tspan baseline-shift="super" font-size="11">5</tspan> Hz</text>

<g transform="translate(865 126)"><rect x="0" y="0" width="157" height="34" rx="5" fill="#fff" stroke="#c8cdd2"/><line x1="14" y1="17" x2="48" y2="17" stroke="#1747d1" stroke-width="4"/><text class="legend" x="58" y="22">Total noise ASD</text></g>
<text class="axis-label" x="570" y="674" text-anchor="middle">Frequency (Hz)</text>
<text class="axis-label" transform="rotate(-90 30 361)" x="30" y="361" text-anchor="middle">Noise amplitude spectral density (V/√Hz)</text>
<text class="note" x="100" y="706">Illustrative ideal model. Actual amplitudes and crossover frequencies depend on MCT composition, geometry, bias, temperature, contacts, passivation, and measurement chain.</text>
</svg>
