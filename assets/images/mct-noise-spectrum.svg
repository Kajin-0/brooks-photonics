<title id="mct-title">Photodetector noise model for an HgCdTe photoconductor</title>
<desc id="mct-desc">Log-log noise amplitude spectral density showing the one-over-f region, generation-recombination region and corner, Johnson region, and a shaded one to ten kilohertz test band.</desc>
