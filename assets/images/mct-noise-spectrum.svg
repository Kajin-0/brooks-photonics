<text class="model" x="112" y="86">eₙ(f) = √[1.84×10⁻⁹/f¹·⁹ + (2.00×10⁻⁷)²/(1+(f/1.7×10⁵)²) + (2.00×10⁻⁸)²]</text>
<text class="region" x="255" y="185">1/f Region</text>
<text class="formula" x="255" y="211">S<tspan baseline-shift="sub" font-size="11">1/f</tspan>(f) = A/f<tspan baseline-shift="super" font-size="11">α</tspan></text>
<text class="region" x="670" y="300">GR Region</text>
<text class="formula" x="645" y="326">S<tspan baseline-shift="sub" font-size="11">GR</tspan>(f) = B/[1+(f/f<tspan baseline-shift="sub" font-size="11">c</tspan>)²]</text>
<text class="region" x="865" y="505">Johnson Region</text>
<text class="formula" x="882" y="531">e<tspan baseline-shift="sub" font-size="11">J</tspan> = √(4k<tspan baseline-shift="sub" font-size="11">B</tspan>TR)</text>
<text x="519.09" y="368.66" font-size="14" fill="#ff00ff">τ<tspan baseline-shift="sub" font-size="11">eff</tspan> = 1/(2πf<tspan baseline-shift="sub" font-size="11">c</tspan>)</text>
