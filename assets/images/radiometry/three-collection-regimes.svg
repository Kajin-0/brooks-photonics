65 395 L900 330 L930 365 L952 320 L970 395 Z" fill="#5f4ca8" opacity=".8"/><line x1="970" y1="220" x2="1035" y2="280" stroke="#7d68de" stroke-width="3"/><line x1="970" y1="400" x2="1035" y2="340" stroke="#7d68de" stroke-width="3"/><ellipse cx="1050" cy="310" rx="18" ry="76" fill="#f5f5f5" stroke="#222" stroke-width="4"/><line x1="1068" y1="310" x2="1132" y2="310" stroke="#7d68de" stroke-width="4" marker-end="url(#arrow)"/><rect x="1140" y="277" width="18" height="66" fill="#ddd" stroke="#222" stroke-width="4"/></g><text x="600" y="575" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#555">same radiance · different geometry</text></svg>