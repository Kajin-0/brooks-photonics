<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Three radiometric collection regimes</title>
  <desc id="desc">Three side-by-side panels compare finite-source dilution, field-filling collection, and imaging.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6f55d9"/></marker>
    <linearGradient id="source" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fde9c6"/><stop offset="100%" stop-color="#f6b557"/></linearGradient>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <line x1="400" y1="70" x2="400" y2="545" stroke="#d8dde3" stroke-width="2"/>
  <line x1="800" y1="70" x2="800" y2="545" stroke="#d8dde3" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#0d1b2a">
    <text x="200" y="76" text-anchor="middle" font-size="28" font-weight="600">finite source</text>
    <text x="600" y="76" text-anchor="middle" font-size="28" font-weight="600">field-filling source</text>
    <text x="1000" y="76" text-anchor="middle" font-size="28" font-weight="600">imaging</text>
  </g>
  <g>
    <circle cx="100" cy="305" r="58" fill="url(#source)" stroke="#ee8e22" stroke-width="3"/>
    <line x1="158" y1="275" x2="300" y2="300" stroke="#6f55d9" stroke-width="3"/>
    <line x1="158" y1="335" x2="300" y2="310" stroke="#6f55d9" stroke-width="3"/>
    <line x1="158" y1="305" x2="300" y2="305" stroke="#6f55d9" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="320" y="278" width="22" height="54" rx="4" fill="#d7dde3" stroke="#222" stroke-width="3"/>
    <text x="200" y="468" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#243746">Φ ∝ A<tspan baseline-shift="sub" font-size="20">s</tspan>/r²</text>
  </g>
  <g>
    <rect x="470" y="215" width="98" height="180" rx="4" fill="url(#source)" stroke="#ee8e22" stroke-width="2.5"/>
    <g stroke="#6f55d9" stroke-width="4" marker-end="url(#arrow)">
      <line x1="548" y1="255" x2="720" y2="255"/>
      <line x1="548" y1="305" x2="720" y2="305"/>
      <line x1="548" y1="355" x2="720" y2="355"/>
    </g>
    <rect x="738" y="278" width="22" height="54" rx="4" fill="#d7dde3" stroke="#222" stroke-width="3"/>
    <text x="600" y="468" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#243746">Φ = A<tspan baseline-shift="sub" font-size="20">d</tspan> L Ω<tspan baseline-shift="sub" font-size="20">p</tspan></text>
  </g>
  <g>
    <rect x="845" y="215" width="105" height="180" rx="4" fill="url(#source)" stroke="#ee8e22" stroke-width="2.5"/>
    <circle cx="897" cy="255" r="12" fill="#fff" stroke="#ee8e22" stroke-width="2"/>
    <path d="M862 395 L888 342 L915 370 L935 330 L950 395 Z" fill="#7059dc" opacity="0.85"/>
    <line x1="950" y1="230" x2="1006" y2="281" stroke="#6f55d9" stroke-width="3"/>
    <line x1="950" y1="380" x2="1006" y2="329" stroke="#6f55d9" stroke-width="3"/>
    <ellipse cx="1024" cy="305" rx="18" ry="70" fill="#f1f3f5" stroke="#222" stroke-width="3"/>
    <line x1="1042" y1="305" x2="1118" y2="305" stroke="#6f55d9" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="1000" y="468" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#243746">E′ ∝ L/(f/#)²</text>
  </g>
  <text x="600" y="570" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#5b6570">same radiance • different geometry</text>
</svg>