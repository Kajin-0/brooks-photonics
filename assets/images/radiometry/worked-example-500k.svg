<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">500 kelvin worked example</title>
  <desc id="desc">A 500 kelvin blackbody aperture, a 250 millimeter separation, and a detector are shown beside a spectral-radiance curve with the 8 to 12 micrometer band shaded.</desc>
  <defs>
    <radialGradient id="sourceGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="100%" stop-color="#f8b44c"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <line x1="620" y1="120" x2="620" y2="525" stroke="#d9dde2" stroke-width="2"/>
  <circle cx="170" cy="300" r="74" fill="url(#sourceGlow)" stroke="#ee8e22" stroke-width="3"/>
  <text x="150" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#0d1b2a">500 K</text>
  <text x="170" y="435" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0d1b2a">25 mm aperture</text>
  <ellipse cx="268" cy="300" rx="10" ry="48" fill="#777" stroke="#333" stroke-width="3"/>
  <ellipse cx="268" cy="300" rx="4" ry="26" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
  <line x1="278" y1="280" x2="506" y2="296" stroke="#f28c18" stroke-width="3"/>
  <line x1="278" y1="320" x2="506" y2="304" stroke="#f28c18" stroke-width="3"/>
  <line x1="278" y1="300" x2="506" y2="300" stroke="#7a8791" stroke-width="2.5" stroke-dasharray="12 10"/>
  <rect x="512" y="277" width="28" height="46" rx="4" fill="#5d92bd" stroke="#23567e" stroke-width="3"/>
  <text x="438" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#0d1b2a">0.25 × 0.25 mm</text>
  <line x1="285" y1="208" x2="515" y2="208" stroke="#1d4f86" stroke-width="2.5"/>
  <line x1="285" y1="190" x2="285" y2="226" stroke="#1d4f86" stroke-width="2.5"/>
  <line x1="515" y1="190" x2="515" y2="226" stroke="#1d4f86" stroke-width="2.5"/>
  <path d="M300 200 l-15 8 l15 8" fill="none" stroke="#1d4f86" stroke-width="2.5"/>
  <path d="M500 200 l15 8 l-15 8" fill="none" stroke="#1d4f86" stroke-width="2.5"/>
  <text x="400" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#0d1b2a">250 mm</text>
  <g transform="translate(700,120)">
    <line x1="0" y1="400" x2="430" y2="400" stroke="#222" stroke-width="3"/>
    <line x1="0" y1="400" x2="0" y2="20" stroke="#222" stroke-width="3"/>
    <rect x="154" y="20" width="86" height="380" fill="#f2e6d2" opacity="0.95"/>
    <line x1="154" y1="20" x2="154" y2="400" stroke="#999" stroke-width="2" stroke-dasharray="10 8"/>
    <line x1="240" y1="20" x2="240" y2="400" stroke="#999" stroke-width="2" stroke-dasharray="10 8"/>
    <path d="M0 400 C30 400 55 394 85 318 C110 252 132 130 154 82 C176 37 205 25 232 64 C265 111 300 210 340 290 C372 342 398 371 430 382" fill="none" stroke="#f06f00" stroke-width="4"/>
    <text x="197" y="0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#0d1b2a">8–12 μm band</text>
    <text x="215" y="474" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#0d1b2a">wavelength (μm)</text>
    <text transform="translate(-96 220) rotate(-90)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#0d1b2a">spectral radiance</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0d1b2a">
      <text x="-10" y="408" text-anchor="end">0</text>
      <text x="0" y="435" text-anchor="middle">0</text>
      <text x="86" y="435" text-anchor="middle">5</text>
      <text x="197" y="435" text-anchor="middle">10</text>
      <text x="326" y="435" text-anchor="middle">15</text>
      <text x="430" y="435" text-anchor="middle">20+</text>
    </g>
  </g>
  <rect x="60" y="560" width="500" height="110" rx="18" fill="#faf8f4" stroke="#ecd6b2" stroke-width="2"/>
  <text x="185" y="626" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#e55400">0.447 W</text>
  <text x="185" y="656" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0d1b2a">emitted in band</text>
  <rect x="640" y="560" width="500" height="110" rx="18" fill="#f4f7fb" stroke="#d2e0ef" stroke-width="2"/>
  <text x="805" y="626" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#1351a6">99 nW</text>
  <text x="805" y="656" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0d1b2a">at detector</text>
</svg>