<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">500 kelvin blackbody worked example</title><desc id="d">A 25 millimeter blackbody aperture is 250 millimeters from a small detector. The adjacent spectrum highlights the 8 to 12 micrometer band.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6f55d9"/></marker><linearGradient id="source" x1="0" x2="1"><stop offset="0" stop-color="#f7f4ff"/><stop offset="1" stop-color="#8c73e6"/></linearGradient></defs><rect width="1200" height="720" fill="#fff"/><g><ellipse cx="180" cy="315" rx="62" ry="112" fill="url(#source)" stroke="#222" stroke-width="4"/><text x="180" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="34">500 K</text><line x1="242" y1="230" x2="590" y2="315" stroke="#7d68de" stroke-width="3"/><line x1="242" y1="400" x2="590" y2="315" stroke="#7d68de" stroke-width="3"/><line x1="242" y1="315" x2="590" y2="315" stroke="#7d68de" stroke-width="4" marker-end="url(#arrow)"/><rect x="600" y="280" width="20" height="70" fill="#ddd" stroke="#222" stroke-width="4"/><line x1="180" y1="470" x2="610" y2="470" stroke="#333" stroke-width="3"/><line x1="180" y1="455" x2="180" y2="485" stroke="#333" stroke-width="3"/><line x1="610" y1="455" x2="610" y2="485" stroke="#333" stroke-width="3"/><text x="395" y="520" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="38">L = 250 mm</text><text x="180" y="585" text-anchor="middle" font-family="Georgia,serif" font-size="34">D<tspan baseline-shift="sub" font-size="22">s</tspan> = 25 mm</text><text x="610" y="585" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="34">P<tspan baseline-shift="sub" font-size="22">det</tspan> ≈ 99 nW</text></g><g transform="translate(700 120)"><line x1="0" y1="400" x2="430" y2="400" stroke="#222" stroke-width="3"/><line x1="0" y1="400" x2="0" y2="40" stroke="#222" stroke-width="3"/><rect x="185" y="40" width="115" height="360" fill="#eeeaff" opacity=".9"/><path d="M0 400 C35 400 55 360 75 270 C100 155 140 95 185 100 C230 105 265 165 300 225 C340 295 375 345 430 375" fill="none" stroke="#222" stroke-width="4"/><text x="243" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-size="30">8–12 μm</text><text x="215" y="455" text-anchor="middle" font-family="Georgia,serif" font-size="32">wavelength λ</text><text transform="translate(-55 235) rotate(-90)" text-anchor="middle" font-family="Georgia,serif" font-size="32">spectral radiance</text></g><text x="820" y="650" font-family="Georgia,serif" font-style="italic" font-size="38">P<tspan baseline-shift="sub" font-size="24">emit</tspan> ≈ 0.447 W</text></svg>