<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Figure 4. 500 K worked example.</title>
  <desc id="desc">Vector worked example showing a 500 kelvin blackbody aperture, detector geometry, 8 to 12 micrometer spectral band, and emitted versus detected power.</desc>
  <defs>
    <radialGradient id="disk" cx="56%" cy="50%" r="60%"><stop offset="0" stop-color="#fff"/><stop offset="0.38" stop-color="#ded9f3"/><stop offset="1" stop-color="#51448e"/></radialGradient>
    <linearGradient id="det" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8294a5"/><stop offset="1" stop-color="#c8d1d8"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7448df"/></marker>
  </defs>
  <rect width="1448" height="1086" fill="#fff"/>

  <text x="724" y="112" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#111">Figure 4. 500 K worked example.</text>
  <text x="724" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#5d5d5d">Large emitted power, tiny detected fraction.</text>

  <text x="160" y="346" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#111">500 K</text>
  <ellipse cx="160" cy="520" rx="72" ry="106" fill="url(#disk)" stroke="#4f477d" stroke-width="3"/>
  <line x1="196" y1="422" x2="650" y2="527" stroke="#687786" stroke-width="2.1" stroke-dasharray="11 9"/>
  <line x1="196" y1="618" x2="650" y2="527" stroke="#687786" stroke-width="2.1" stroke-dasharray="11 9"/>
  <g stroke="#7448df" stroke-width="2.7" marker-end="url(#arrow)">
    <line x1="191" y1="487" x2="646" y2="525"/>
    <line x1="191" y1="520" x2="646" y2="527"/>
    <line x1="191" y1="553" x2="646" y2="529"/>
  </g>
  <rect x="650" y="490" width="20" height="76" fill="url(#det)" stroke="#2b2b2b" stroke-width="4"/>
  <text x="660" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="44" fill="#111">P<tspan baseline-shift="sub" font-size="26">det</tspan></text>

  <line x1="66" y1="417" x2="66" y2="622" stroke="#222" stroke-width="2.4"/>
  <line x1="57" y1="417" x2="75" y2="417" stroke="#222" stroke-width="2.4"/>
  <line x1="57" y1="622" x2="75" y2="622" stroke="#222" stroke-width="2.4"/>
  <text x="43" y="535" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="43" fill="#111">D<tspan baseline-shift="sub" font-size="25">s</tspan></text>

  <line x1="160" y1="662" x2="655" y2="662" stroke="#222" stroke-width="2.4"/>
  <line x1="160" y1="647" x2="160" y2="677" stroke="#222" stroke-width="2.4"/>
  <line x1="655" y1="647" x2="655" y2="677" stroke="#222" stroke-width="2.4"/>
  <path d="M176 653 L160 662 L176 671" fill="none" stroke="#222" stroke-width="2.2"/>
  <path d="M639 653 L655 662 L639 671" fill="none" stroke="#222" stroke-width="2.2"/>
  <text x="408" y="646" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="44" fill="#111">L</text>

  <text x="1100" y="288" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#111">500 K blackbody</text>
  <line x1="885" y1="650" x2="1370" y2="650" stroke="#222" stroke-width="3"/>
  <line x1="885" y1="650" x2="885" y2="310" stroke="#222" stroke-width="3"/>
  <rect x="1080" y="330" width="97" height="320" fill="#dcd4f5" opacity="0.65"/>
  <line x1="1080" y1="330" x2="1080" y2="650" stroke="#9a82dc" stroke-width="2" stroke-dasharray="10 8"/>
  <line x1="1177" y1="330" x2="1177" y2="650" stroke="#9a82dc" stroke-width="2" stroke-dasharray="10 8"/>
  <path d="M885 650 C930 650 946 628 968 555 C991 475 1015 365 1040 350 C1062 337 1081 365 1110 420 C1146 490 1197 550 1270 592 C1315 618 1342 630 1370 635" fill="none" stroke="#111" stroke-width="4"/>
  <text x="1128" y="319" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="39" fill="#111">8–12 μm</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#111">
    <text x="885" y="685" text-anchor="middle">0</text>
    <text x="1000" y="685" text-anchor="middle">5</text>
    <text x="1118" y="685" text-anchor="middle">10</text>
    <text x="1240" y="685" text-anchor="middle">15</text>
    <text x="1360" y="685" text-anchor="middle">20</text>
  </g>
  <text x="1125" y="739" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#111">Wavelength λ (μm)</text>
  <text transform="translate(825 500) rotate(-90)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#111">Spectral exitance (W m⁻² μm⁻¹)</text>

  <g fill="#fff" stroke="#666" stroke-width="2">
    <rect x="66" y="789" width="305" height="110" rx="13"/>
    <rect x="398" y="789" width="305" height="110" rx="13"/>
    <rect x="730" y="789" width="305" height="110" rx="13"/>
    <rect x="1062" y="789" width="320" height="110" rx="13"/>
  </g>
  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="43" fill="#111">
    <text x="218" y="856">D<tspan baseline-shift="sub" font-size="25">s</tspan> = 25 mm</text>
    <text x="550" y="856">L = 250 mm</text>
    <text x="882" y="856">τ = 0.70</text>
    <text x="1222" y="856">P<tspan baseline-shift="sub" font-size="25">det</tspan> ≈ 99 nW</text>
  </g>
  <text x="724" y="1003" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="52" fill="#111">P<tspan baseline-shift="sub" font-size="30">emit</tspan> ≈ 0.447 W</text>
</svg>
