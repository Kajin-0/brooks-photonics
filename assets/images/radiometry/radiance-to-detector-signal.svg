<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Figure 1. Radiance to detector signal.</title>
  <desc id="desc">Minimal vector schematic showing source radiance passing through admitted area-angle throughput and transmission to detector power, then converting to electrical signal.</desc>
  <defs>
    <radialGradient id="src" cx="48%" cy="50%" r="65%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#d8d3f2"/>
      <stop offset="1" stop-color="#51448e"/>
    </radialGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="0.5" stop-color="#dbe5ef"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="det" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8294a5"/>
      <stop offset="1" stop-color="#c4d0d9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7448df"/>
    </marker>
  </defs>
  <rect width="1448" height="1086" fill="#fff"/>

  <text x="724" y="106" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#111">Figure 1. Radiance to detector signal.</text>
  <text x="724" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#5d5d5d">Only the admitted radiance reaches the detector.</text>

  <text x="160" y="344" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="58" fill="#111">L<tspan baseline-shift="sub" font-size="34">λ</tspan></text>

  <path d="M70 375 L255 417 L255 650 L70 710 Z" fill="url(#src)" stroke="#5d5589" stroke-width="2"/>
  <line x1="255" y1="440" x2="945" y2="560" stroke="#687786" stroke-width="2.2" stroke-dasharray="12 10"/>
  <line x1="255" y1="655" x2="945" y2="560" stroke="#687786" stroke-width="2.2" stroke-dasharray="12 10"/>
  <line x1="155" y1="547" x2="935" y2="560" stroke="#7448df" stroke-width="3.5" marker-end="url(#arrow)"/>

  <line x1="693" y1="386" x2="693" y2="441" stroke="#292929" stroke-width="10" stroke-linecap="round"/>
  <line x1="693" y1="668" x2="693" y2="724" stroke="#292929" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="704" cy="558" rx="24" ry="91" fill="url(#lens)" stroke="#2b2b2b" stroke-width="5"/>
  <text x="704" y="350" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="54" fill="#111">AΩ<tspan baseline-shift="sub" font-size="30">p</tspan>, τ</text>

  <rect x="950" y="505" width="31" height="108" rx="2" fill="url(#det)" stroke="#2b2b2b" stroke-width="5"/>
  <text x="966" y="468" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="51" fill="#111">P<tspan baseline-shift="sub" font-size="30">det</tspan></text>

  <line x1="1000" y1="560" x2="1112" y2="560" stroke="#7448df" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="1160" y="577" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="58" fill="#111">S = R · P<tspan baseline-shift="sub" font-size="34">det</tspan></text>

  <text x="724" y="900" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="57" fill="#111">
    P<tspan baseline-shift="sub" font-size="34">det</tspan>
    <tspan font-style="normal"> = </tspan>
    <tspan>∫ L</tspan><tspan baseline-shift="sub" font-size="34">λ</tspan>
    <tspan> τ(λ) A</tspan><tspan baseline-shift="sub" font-size="34">d</tspan>
    <tspan> Ω</tspan><tspan baseline-shift="sub" font-size="34">p</tspan>
    <tspan> dλ</tspan>
  </text>
</svg>
