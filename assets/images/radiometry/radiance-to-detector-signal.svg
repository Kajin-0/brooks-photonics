<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Radiance to detector signal</title><desc id="d">A source emits radiance through an accepted optical cone to a detector, which converts detector power into electrical signal.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6f55d9"/></marker><linearGradient id="source" x1="0" x2="1"><stop offset="0" stop-color="#f7f4ff"/><stop offset="1" stop-color="#8c73e6"/></linearGradient></defs><rect width="1200" height="600" fill="#fff"/><path d="M110 180 L285 240 L285 360 L110 420 Z" fill="url(#source)" opacity=".9"/><text x="145" y="150" font-family="Georgia,serif" font-style="italic" font-size="48" fill="#111">L<tspan baseline-shift="sub" font-size="30">λ</tspan></text><line x1="285" y1="255" x2="560" y2="300" stroke="#7d68de" stroke-width="3"/><line x1="285" y1="345" x2="560" y2="300" stroke="#7d68de" stroke-width="3"/><line x1="285" y1="300" x2="558" y2="300" stroke="#7d68de" stroke-width="4" marker-end="url(#arrow)"/><ellipse cx="590" cy="300" rx="24" ry="88" fill="#f5f5f5" stroke="#222" stroke-width="5"/><line x1="590" y1="185" x2="590" y2="135" stroke="#222" stroke-width="6"/><line x1="590" y1="415" x2="590" y2="465" stroke="#222" stroke-width="6"/><text x="545" y="105" font-family="Georgia,serif" font-size="42" fill="#111">AΩ, τ</text><line x1="614" y1="300" x2="820" y2="300" stroke="#7d68de" stroke-width="4" marker-end="url(#arrow)"/><rect x="840" y="248" width="34" height="104" fill="#ddd" stroke="#222" stroke-width="5"/><text x="800" y="210" font-family="Georgia,serif" font-style="italic" font-size="44" fill="#111">P<tspan baseline-shift="sub" font-size="28">det</tspan></text><line x1="885" y1="300" x2="1000" y2="300" stroke="#7d68de" stroke-width="5" marker-end="url(#arrow)"/><text x="1025" y="315" font-family="Georgia,serif" font-style="italic" font-size="44" fill="#111">S = R · P<tspan baseline-shift="sub" font-size="28">det</tspan></text></svg>