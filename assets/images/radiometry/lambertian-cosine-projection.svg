<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Lambertian cosine projection</title><desc id="d">A Lambertian surface patch emits into a hemisphere. An oblique direction sees projected area dA cos theta, producing the pi radiance factor.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6f55d9"/></marker><linearGradient id="source" x1="0" x2="1"><stop offset="0" stop-color="#f7f4ff"/><stop offset="1" stop-color="#8c73e6"/></linearGradient></defs><rect width="1200" height="720" fill="#fff"/><path d="M160 510 A420 420 0 0 1 1000 510" fill="none" stroke="#222" stroke-width="4"/><line x1="160" y1="510" x2="1000" y2="510" stroke="#222" stroke-width="3"/><rect x="545" y="480" width="90" height="34" transform="skewX(-20)" fill="#eee" stroke="#222" stroke-width="3"/><text x="555" y="555" font-family="Georgia,serif" font-style="italic" font-size="38">dA</text><line x1="590" y1="495" x2="590" y2="205" stroke="#222" stroke-width="4" marker-end="url(#arrow)"/><text x="610" y="210" font-family="Georgia,serif" font-style="italic" font-size="42">n̂</text><line x1="590" y1="495" x2="760" y2="250" stroke="#6f55d9" stroke-width="5" marker-end="url(#arrow)"/><path d="M590 355 A140 140 0 0 1 670 382" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="8 8"/><text x="675" y="370" font-family="Georgia,serif" font-style="italic" font-size="42">θ</text><g stroke="#a997ee" stroke-width="3" marker-end="url(#arrow)" opacity=".9"><line x1="590" y1="495" x2="360" y2="300"/><line x1="590" y1="495" x2="460" y2="240"/><line x1="590" y1="495" x2="720" y2="240"/><line x1="590" y1="495" x2="825" y2="305"/></g><g transform="translate(900 240)"><polygon points="0,70 95,35 150,70 55,105" fill="#eee" stroke="#222" stroke-width="3"/><polygon points="0,190 95,155 150,190 55,225" fill="#eeeaff" stroke="#6f55d9" stroke-width="3"/><line x1="0" y1="70" x2="0" y2="190" stroke="#999" stroke-width="2" stroke-dasharray="7 7"/><line x1="150" y1="70" x2="150" y2="190" stroke="#999" stroke-width="2" stroke-dasharray="7 7"/><text x="60" y="20" font-family="Georgia,serif" font-style="italic" font-size="34">dA</text><text x="35" y="270" font-family="Georgia,serif" font-style="italic" font-size="34">dA cos θ</text></g><text x="365" y="660" font-family="Georgia,serif" font-style="italic" font-size="48" fill="#111">M<tspan baseline-shift="sub" font-size="30">λ</tspan> = π L<tspan baseline-shift="sub" font-size="30">λ</tspan></text></svg>