<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Figure 2. Why a Lambertian emitter gives pi L lambda.</title>
  <desc id="desc">Vector diagram of a Lambertian surface patch emitting into a hemisphere with unit normal n-hat, oblique ray, angle theta, and projected area dA cos theta.</desc>
  <defs>
    <marker id="arrowP" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7448df"/></marker>
    <marker id="arrowL" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b19ee6"/></marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker>
  </defs>
  <rect width="1448" height="1086" fill="#fff"/>

  <text x="724" y="106" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="61" fill="#111">Figure 2. Why a Lambertian emitter gives πL<tspan baseline-shift="sub" font-size="35">λ</tspan>.</text>
  <text x="724" y="169" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#5d5d5d">The cosine projection matters.</text>

  <path d="M300 691 A408 408 0 0 1 1116 691" fill="none" stroke="#222" stroke-width="3.2"/>
  <path d="M300 691 A408 95 0 0 0 1116 691" fill="#f7f7f7" stroke="#222" stroke-width="3.2"/>
  <path d="M300 691 A408 95 0 0 1 1116 691" fill="none" stroke="#444" stroke-width="2.2" stroke-dasharray="11 9"/>

  <polygon points="672,676 756,676 786,650 702,650" fill="#eeeeee" stroke="#2a2a2a" stroke-width="2.5"/>
  <text x="724" y="728" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="48" fill="#111">dA</text>

  <line x1="724" y1="676" x2="724" y2="348" stroke="#222" stroke-width="3.5" marker-end="url(#arrowB)"/>
  <g aria-label="unit normal n-hat">
    <text x="724" y="320" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="54" fill="#111">n</text>
    <path d="M707 274 L724 261 L741 274" fill="none" stroke="#111" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <line x1="724" y1="676" x2="892" y2="367" stroke="#7448df" stroke-width="4" marker-end="url(#arrowP)"/>
  <path d="M724 464 A212 212 0 0 1 824 493" fill="none" stroke="#222" stroke-width="2.3" stroke-dasharray="10 8"/>
  <text x="808" y="446" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="49" fill="#111">θ</text>

  <g stroke="#b19ee6" stroke-width="2.5" opacity="0.95" marker-end="url(#arrowL)">
    <line x1="724" y1="676" x2="408" y2="438"/>
    <line x1="724" y1="676" x2="516" y2="340"/>
    <line x1="724" y1="676" x2="624" y2="280"/>
    <line x1="724" y1="676" x2="984" y2="347"/>
    <line x1="724" y1="676" x2="1070" y2="440"/>
  </g>

  <polygon points="1190,466 1282,466 1334,420 1242,420" fill="#e8e8e8" stroke="#333" stroke-width="2"/>
  <polygon points="1190,582 1282,582 1334,536 1242,536" fill="#ece9fb" stroke="#5f50b4" stroke-width="2"/>
  <line x1="1190" y1="466" x2="1190" y2="582" stroke="#777" stroke-width="1.8" stroke-dasharray="9 7"/>
  <line x1="1282" y1="466" x2="1282" y2="582" stroke="#777" stroke-width="1.8" stroke-dasharray="9 7"/>
  <line x1="1334" y1="420" x2="1334" y2="536" stroke="#777" stroke-width="1.8" stroke-dasharray="9 7"/>
  <text x="1326" y="406" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="43" fill="#111">dA</text>
  <text x="1297" y="638" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="41" fill="#111">dA cos θ</text>

  <text x="724" y="915" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="53" fill="#111">
    M<tspan baseline-shift="sub" font-size="31">λ</tspan>
    <tspan font-style="normal"> = </tspan>
    <tspan>∫</tspan><tspan baseline-shift="sub" font-size="27">hemisphere</tspan>
    <tspan> L</tspan><tspan baseline-shift="sub" font-size="31">λ</tspan>
    <tspan> cos θ dΩ = πL</tspan><tspan baseline-shift="sub" font-size="31">λ</tspan>
  </text>
</svg>
