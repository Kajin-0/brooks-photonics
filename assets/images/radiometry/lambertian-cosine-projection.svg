<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Lambertian cosine projection</title>
  <desc id="desc">A source patch emits into a hemisphere. The projected patch dA cos theta explains why the Lambertian integral gives M lambda equals pi L lambda.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2a69b2"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f28c18"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <path d="M110 510 A380 380 0 0 1 870 510" fill="#eff6fb" stroke="#5f8fb8" stroke-width="3"/>
  <path d="M110 510 A380 130 0 0 0 870 510" fill="none" stroke="#91b2cc" stroke-width="2.5" stroke-dasharray="12 10"/>
  <line x1="110" y1="510" x2="870" y2="510" stroke="#5f8fb8" stroke-width="3"/>
  <text x="490" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#0d1b2a">projected hemisphere</text>
  <line x1="490" y1="112" x2="490" y2="154" stroke="#222" stroke-width="2.5"/>
  <ellipse cx="455" cy="488" rx="60" ry="24" fill="#b9d4e9" stroke="#406d95" stroke-width="3"/>
  <text x="455" y="603" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="42" fill="#0d1b2a">dA</text>
  <line x1="455" y1="488" x2="455" y2="250" stroke="#2a69b2" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="475" y="242" font-family="Georgia, serif" font-style="italic" font-size="40" fill="#0d1b2a">n̂</text>
  <line x1="455" y1="488" x2="705" y2="270" stroke="#f28c18" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <path d="M455 350 A138 138 0 0 1 560 402" fill="none" stroke="#243746" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="575" y="392" font-family="Georgia, serif" font-style="italic" font-size="40" fill="#0d1b2a">θ</text>
  <g stroke="#89a9c3" stroke-width="2.5" opacity="0.95">
    <line x1="455" y1="488" x2="250" y2="320" marker-end="url(#arrowBlue)"/>
    <line x1="455" y1="488" x2="358" y2="250" marker-end="url(#arrowBlue)"/>
    <line x1="455" y1="488" x2="612" y2="248" marker-end="url(#arrowBlue)"/>
    <line x1="455" y1="488" x2="777" y2="350" marker-end="url(#arrowBlue)"/>
  </g>
  <line x1="705" y1="270" x2="705" y2="488" stroke="#8ea7bc" stroke-width="2.5" stroke-dasharray="10 8"/>
  <ellipse cx="705" cy="488" rx="54" ry="20" fill="#f9eddc" stroke="#f28c18" stroke-width="2.5" stroke-dasharray="10 8"/>
  <line x1="770" y1="560" x2="705" y2="505" stroke="#243746" stroke-width="2"/>
  <text x="782" y="575" font-family="Georgia, serif" font-style="italic" font-size="34" fill="#0d1b2a">dA cos θ</text>
  <text x="975" y="332" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="66" fill="#0d1b2a">M<tspan baseline-shift="sub" font-size="38">λ</tspan> = π L<tspan baseline-shift="sub" font-size="38">λ</tspan></text>
</svg>