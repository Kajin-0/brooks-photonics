name: Polish ENBW reference layout

on:
  push:
    branches:
      - agent/enbw-final-editorial-polish

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply reference-page improvements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('posts/lock-in-noise-enbw.html')
          html = path.read_text(encoding='utf-8')

          css_anchor = '.warning-symbol{display:inline-grid;place-items:center;width:1.35em;height:1.35em;margin-right:.45em;border:1.5px solid var(--purple-dark);border-radius:50%;color:var(--purple-dark);font-weight:700;line-height:1;vertical-align:-.08em}\n'
          css_extra = '''body .article-layout{grid-template-areas:"article toc"}
          body .article-body{grid-area:article}
          body .article-aside{grid-area:toc}
          .quick-reference{margin:8px 0 48px;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
          .quick-reference h2{margin:0 0 14px;font-size:1rem;font-weight:600;letter-spacing:.01em}
          .quick-reference-grid{display:grid;grid-template-columns:minmax(220px,.85fr) minmax(0,1.4fr);gap:32px;align-items:center}
          .quick-reference .math-display{margin:0;text-align:left}
          .quick-reference ul{margin:0;padding-left:1.15rem}
          .quick-reference li{font-size:15.5px;line-height:1.55}
          .worked-example-row td{background:#faf7fd;box-shadow:inset 0 1px 0 #bdaec9,inset 0 -1px 0 #bdaec9}
          .worked-example-row td:first-child{border-left:3px solid var(--purple-dark)}
          .row-note{display:block;margin-top:3px;color:var(--purple-dark);font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
          .verification-note{margin:0 0 18px;color:var(--ink-soft);font-size:14px}
          '''
          assert css_anchor in html
          html = html.replace(css_anchor, css_anchor + css_extra, 1)
          html = html.replace('@media(max-width:900px){.instrument-grid{grid-template-columns:1fr}}', '@media(max-width:900px){body .article-layout{grid-template-areas:"toc" "article"}.quick-reference-grid{grid-template-columns:1fr;gap:14px}.instrument-grid{grid-template-columns:1fr}}', 1)

          definition = '<p class="definition-line"><strong>Definition:</strong> Equivalent noise bandwidth is the width of an ideal rectangular filter that transmits the same white-noise power as the actual measurement filter.</p>\n'
          quick = r'''<p class="definition-line"><strong>Definition:</strong> Equivalent noise bandwidth is the width of an ideal rectangular filter that transmits the same white-noise power as the actual measurement filter.</p>
<section class="quick-reference" aria-labelledby="quick-reference-title"><h2 id="quick-reference-title">At a glance</h2><div class="quick-reference-grid"><div class="math-display">\[ e_n=\frac{V_{n,\mathrm{rms}}}{\sqrt{B_{\mathrm{ENBW}}}} \]</div><ul><li>Use the ENBW for the exact instrument and filter mode.</li><li>Reference frequency and measurement bandwidth are different quantities.</li><li>SR830 X Noise and Y Noise already include ENBW normalization.</li></ul></div></section>
'''
          assert definition in html
          html = html.replace(definition, quick, 1)

          row_old = '<tr><td>2</td><td>12 dB/oct</td>'
          row_new = '<tr class="worked-example-row"><td>2<span class="row-note">worked example</span></td><td>12 dB/oct</td>'
          assert row_old in html
          html = html.replace(row_old, row_new, 1)

          heading_old = '<h3 id="sr830-warning">SR830 noise-display warning</h3>\n<div class="warning-note"><h3>The front-panel number is already in \\(\\mathrm{V}/\\sqrt{\\mathrm{Hz}}\\)</h3><p>When the SR830 display is set to <strong>X Noise</strong> or <strong>Y Noise</strong>,'
          heading_new = '<h3 id="sr830-warning">SR830 X Noise and Y Noise are already normalized</h3>\n<div class="warning-note"><p><strong>Do not normalize the displayed value a second time.</strong> When the SR830 display is set to <strong>X Noise</strong> or <strong>Y Noise</strong>,'
          assert heading_old in html
          html = html.replace(heading_old, heading_new, 1)

          citation_old = 'and that the output-filter ENBW is already included.</p>'
          citation_new = 'and that the output-filter ENBW is already included. This is stated in the <a href="https://www.thinksrs.com/downloads/pdfs/manuals/SR830m.pdf#page=53">SR830 manual, Section 3, “Noise Measurements,” p. 3-26 (PDF page 53)</a>.</p>'
          assert citation_old in html
          html = html.replace(citation_old, citation_new, 1)

          refs_old = '<section class="article-references"><h2>References</h2><ul>'
          refs_new = '<section class="article-references"><h2>References</h2><p class="verification-note">Instrument documentation verified July 27, 2026.</p><ul>'
          assert refs_old in html
          html = html.replace(refs_old, refs_new, 1)
          html = html.replace('href="https://www.thinksrs.com/downloads/pdfs/manuals/SR830m.pdf">Stanford Research Systems, SR830 manual</a>', 'href="https://www.thinksrs.com/downloads/pdfs/manuals/SR830m.pdf#page=53">Stanford Research Systems, SR830 manual, “Noise Measurements,” p. 3-26</a>', 1)

          pattern = re.compile(r'(<article class="article-body">.*?</article>)(<aside class="article-aside".*?</aside>)', re.S)
          match = pattern.search(html)
          assert match, 'article and TOC blocks not found'
          html = html[:match.start()] + match.group(2) + match.group(1) + html[match.end():]

          assert html.index('<aside class="article-aside"') < html.index('<article class="article-body">')
          assert 'At a glance' in html
          assert 'worked-example-row' in html
          assert 'Minimum reporting information' not in html
          assert '../assets/images/sr830-front.jpg' in html
          assert '../assets/images/mfli-front.webp' in html
          assert '../assets/images/par124a-front.jpg' in html

          path.write_text(html, encoding='utf-8')
          PY

          rm -f .tmp/enbw-reference-polish-trigger
          rm -f .github/workflows/enbw-reference-polish.yml

      - name: Commit reference-page improvements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve ENBW reference navigation and citations"
          git push
