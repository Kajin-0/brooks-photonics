name: Rebalance ENBW article

on:
  push:
    branches:
      - agent/enbw-general-resource-balance

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebalance article around general ENBW principles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("posts/lock-in-noise-enbw.html")
          html = path.read_text(encoding="utf-8")

          old_toc = '<aside class="article-aside" aria-label="Article contents"><h2>Contents</h2><a href="#conversion">Basic conversion</a><a href="#graphical-meaning">Graphical meaning</a><a href="#bandwidth-distinction">ENBW vs −3 dB</a><a href="#example">Worked example</a><a href="#instrument-dependence">Instrument dependence</a><a href="#conversion-table">Conversion table</a><a href="#practical-observations">Detector observations</a><a href="#par124a">PAR 124A</a><a href="#sr830-warning">SR830 warning</a><a href="#common-errors">Common errors</a><a href="#workflow">Workflow</a></aside>'
          new_toc = '<aside class="article-aside" aria-label="Article contents"><h2>Contents</h2><a href="#conversion">Basic conversion</a><a href="#graphical-meaning">Graphical meaning</a><a href="#bandwidth-distinction">ENBW vs −3 dB</a><a href="#example">Worked example</a><a href="#instrument-dependence">Instrument dependence</a><a href="#conversion-table">Conversion factors</a><a href="#practical-observations">Practical examples</a><a href="#reporting-conventions">Reporting conventions</a><a href="#instrument-floor">Instrument noise floor</a><a href="#common-errors">Common errors</a><a href="#workflow">Workflow</a></aside>'
          assert old_toc in html
          html = html.replace(old_toc, new_toc, 1)

          old_quick = '<li>SR830 X Noise and Y Noise already include ENBW normalization.</li>'
          new_quick = '<li>Determine whether the instrument reports filtered RMS noise or an already normalized spectral density before applying the conversion.</li>'
          assert old_quick in html
          html = html.replace(old_quick, new_quick, 1)

          old_heading = '<h2 id="conversion-table">MFLI conversion chart and SR830 comparison</h2>'
          new_heading = '<h2 id="conversion-table">Cascaded-RC ENBW conversion factors</h2>'
          assert old_heading in html
          html = html.replace(old_heading, new_heading, 1)

          old_intro = 'The MFLI documentation separates time constant, \\(-3\\,\\mathrm{dB}\\) bandwidth, and noise-equivalent power bandwidth. Its first four cascaded-RC orders have the same ENBW coefficients as the SR830 because the underlying filter model and time-constant convention are the same.'
          new_intro = "For cascaded-RC low-pass filters, the conversion is set by filter order and the instrument's time-constant convention. The MFLI and SR830 provide a useful comparison: over their shared first four orders, they use the same coefficients because the underlying filter model and convention are the same."
          assert old_intro in html
          html = html.replace(old_intro, new_intro, 1)

          start = html.index('<h2 id="practical-observations">')
          end = html.index('<h2 id="common-errors">', start)
          practical = '''<h2 id="practical-observations">Practical instrument examples</h2>
          <p>ENBW is a general measurement concept, but the correct calculation depends on what the instrument filters, records, and reports. The examples below show why the manual and the actual acquisition mode matter.</p>
          <h3>MFLI: explicit bandwidth conversion</h3>
          <p>The MFLI documentation separates time constant, \\(-3\\,\\mathrm{dB}\\) bandwidth, and noise-equivalent power bandwidth. When a time series of \\(X\\) or \\(Y\\) is converted from RMS noise to spectral density, the filter-specific ENBW is required unless the selected software function has already performed that normalization.</p>
          <div class="observation"><p><strong>Laboratory observation:</strong> a legacy analog lock-in can sometimes feel more transparent for narrowband detector-noise work because the user sees a filtered analog output without hidden statistical normalization. That practical advantage should not be confused with a universal claim that analog instruments are always more accurate.</p></div>
          <h3 id="par124a">PAR/EG&amp;G 124A: direct analog output</h3>
          <div class="instrument-grid-single"><figure class="instrument-card"><img alt="Front panel of the PAR EG and G 124A analog lock-in amplifier" loading="lazy" src="../assets/images/par124a-front.jpg"/><figcaption><strong>PAR/EG&amp;G 124A analog lock-in amplifier.</strong> A legacy instrument with a direct, comparatively transparent analog measurement path.</figcaption></figure></div>
          <p>The PAR124A lacks modern automated averaging and data acquisition, but it can be effective for stable, narrowband measurements when its own input noise and filter characteristics are known. Its ENBW must be obtained from the PAR124A filter response rather than borrowed from another instrument's table.</p>
          <h3 id="reporting-conventions">Instrument reporting conventions</h3>
          <p>Before dividing by \\(\\sqrt{B_{\\mathrm{ENBW}}}\\), determine whether the instrument is returning a filtered RMS fluctuation or a value that has already been normalized to spectral density. The labels and units shown by the interface are not always sufficient.</p>
          <div class="warning-note"><p><strong>SR830 example: do not normalize X Noise or Y Noise a second time.</strong> The front panel shows a numerical value without a visible “/√Hz” suffix, but the value is already reported in <strong>\\(\\mathrm{V}/\\sqrt{\\mathrm{Hz}}\\)</strong> with the output-filter ENBW included. This is stated in the <a href="https://www.thinksrs.com/downloads/pdfs/manuals/SR830m.pdf#page=53">SR830 manual, Section 3, “Noise Measurements,” p. 3-26 (PDF page 53)</a>.</p><p>The built-in result uses a moving mean absolute deviation, or MAD, rescaled to estimate RMS noise under a Gaussian-noise assumption. For precision work, inspect and analyze the settled \\(X\\) or \\(Y\\) time series rather than relying only on one scalar display value.</p></div>
          <h3 id="instrument-floor">Account for the instrument noise floor</h3>
          <p>Instrument noise is independent of ENBW normalization and must be included in the uncertainty budget. Uncorrelated detector and instrument contributions combine in quadrature:</p>
          <div class="equation">\\[ e_{n,\\mathrm{meas}}=\\sqrt{e_{n,\\mathrm{det}}^2+e_{n,\\mathrm{inst}}^2} \\]</div>
          <p>Combining a \\(10\\,\\mathrm{nV}/\\sqrt{\\mathrm{Hz}}\\) detector contribution with a \\(6\\,\\mathrm{nV}/\\sqrt{\\mathrm{Hz}}\\) instrument contribution gives approximately \\(11.7\\,\\mathrm{nV}/\\sqrt{\\mathrm{Hz}}\\), a 17% increase. At \\(30\\,\\mathrm{nV}/\\sqrt{\\mathrm{Hz}}\\), the same instrument contribution raises the result to approximately \\(30.6\\,\\mathrm{nV}/\\sqrt{\\mathrm{Hz}}\\), only about 2%.</p>
          <p>For HgCdTe and other low-noise detectors, ENBW is therefore only one part of the measurement. Preamplifier gain, drift, microphonics, line pickup, random-telegraph events, and estimator behavior can be equally important.</p>
          '''
          html = html[:start] + practical + html[end:]

          old_refs = '<section class="article-references"><h2>References</h2><p class="verification-note">Instrument documentation verified July 27, 2026.</p><ul><li><a href="https://www.thinksrs.com/downloads/pdfs/manuals/SR830m.pdf#page=53">Stanford Research Systems, SR830 manual, “Noise Measurements,” p. 3-26</a></li><li><a href="https://www.thinksrs.com/products/sr830.html">Stanford Research Systems, SR830 product page</a></li><li><a href="https://docs.zhinst.com/mfli_user_manual/signal_processing_basics.html">Zurich Instruments, MFLI signal-processing basics</a></li><li><a href="https://docs.zhinst.com/mfli_user_manual/functional_description/lock_in.html">Zurich Instruments, MFLI lock-in filter controls</a></li></ul></section>'
          new_refs = '<section class="article-references"><h2>References</h2><p class="verification-note">Instrument documentation verified July 27, 2026.</p><ul><li><a href="https://www.thinksrs.com/downloads/pdfs/manuals/SR830m.pdf#page=53">Stanford Research Systems, SR830 manual, “Noise Measurements,” p. 3-26</a></li><li><a href="https://www.thinksrs.com/products/sr830.html">Stanford Research Systems, SR830 product page</a></li><li><a href="https://docs.zhinst.com/mfli_user_manual/signal_processing_basics.html">Zurich Instruments, MFLI signal-processing basics</a></li><li><a href="https://docs.zhinst.com/mfli_user_manual/functional_description/lock_in.html">Zurich Instruments, MFLI lock-in filter controls</a></li><li><a href="https://www.zhinst.com/americas/en/blogs/noise-spectral-density-measured-lock-amplifiers/">Zurich Instruments, noise spectral density measured with lock-in amplifiers</a></li></ul></section>'
          assert old_refs in html
          html = html.replace(old_refs, new_refs, 1)

          assert html.count('aria-label="Article contents"') == 1
          assert 'MFLI conversion chart and SR830 comparison' not in html
          assert 'SR830 noise-display warning' not in html
          assert '../assets/images/sr830-front.jpg' in html
          assert '../assets/images/mfli-front.webp' in html
          assert '../assets/images/par124a-front.jpg' in html

          path.write_text(html, encoding="utf-8")
          PY

          rm -f .github/workflows/rebalance-enbw-article.yml

      - name: Commit article rebalance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebalance ENBW article around general measurement principles"
          git push
