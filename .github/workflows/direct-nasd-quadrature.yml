name: Direct NASD quadrature model

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'agent/direct-nasd-quadrature-model'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/direct-nasd-quadrature-model
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy matplotlib
      - name: Apply direct NASD model
        run: python tools/direct_nasd_update.py
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use direct quadrature NASD model"
          git push origin HEAD:agent/direct-nasd-quadrature-model
