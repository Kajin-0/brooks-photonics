name: Direct NASD quadrature model

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'agent/direct-nasd-quadrature-model'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/direct-nasd-quadrature-model
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy matplotlib
      - name: Preserve LaTeX in exact HTML strings
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/direct_nasd_update.py')
          text = path.read_text(encoding='utf-8')
          markers = [
              '<li><strong>Check the Johnson prediction.</strong>',
              '<li><strong>Fit Lorentzian structure.</strong>',
              '<li><strong>Fit the low-frequency term last.</strong>',
          ]
          for marker in markers:
              old = "        '" + marker
              new = "        r'" + marker
              count = text.count(old)
              if count != 2:
                  raise SystemExit(f'Expected two strings for {marker}, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply direct NASD model
        run: |
          set +e
          python tools/direct_nasd_update.py > .github/direct-nasd-update.log 2>&1
          status=$?
          echo "$status" > .github/direct-nasd-update.status
          cat .github/direct-nasd-update.log
          if [ "$status" -eq 0 ]; then
            rm -f .github/direct-nasd-update.log .github/direct-nasd-update.status
          fi
          exit 0
      - name: Commit result or diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Run direct quadrature NASD update"
          git push origin HEAD:agent/direct-nasd-quadrature-model
