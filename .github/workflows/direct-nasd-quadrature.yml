name: Direct NASD quadrature model

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'agent/direct-nasd-quadrature-model'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/direct-nasd-quadrature-model
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy matplotlib
      - name: Render corrected NASD figure
        run: |
          set +e
          python - <<'PY' > .github/direct-nasd-update.log 2>&1
          from pathlib import Path
          import importlib.util

          script = Path('tools/direct_nasd_update.py')
          text = script.read_text(encoding='utf-8')
          text = text.replace(r'k_{\mathrm B}', r'k_{\mathrm{B}}')
          script.write_text(text, encoding='utf-8')

          spec = importlib.util.spec_from_file_location('direct_nasd_update', script)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          module.render_figure()
          module.clean_temporary_files()
          PY
          status=$?
          echo "$status" > .github/direct-nasd-update.status
          cat .github/direct-nasd-update.log
          if [ "$status" -eq 0 ]; then
            rm -f .github/direct-nasd-update.log .github/direct-nasd-update.status
          fi
          exit 0
      - name: Commit result or diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize direct quadrature NASD model"
          git push origin HEAD:agent/direct-nasd-quadrature-model
