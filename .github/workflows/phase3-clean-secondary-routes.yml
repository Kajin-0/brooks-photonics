name: Phase 3 clean secondary URL migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3-clean-secondary-routes.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate remaining public routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          CASE_OLD = 'case-study-wfc3-ir-ramp.html'
          CASE_ROUTE = '/case-studies/wfc3-ir-ramp/'
          CASE_URL = 'https://brooks-photonics.com/case-studies/wfc3-ir-ramp/'
          THANKS_OLD = 'thanks.html'
          THANKS_ROUTE = '/thanks/'
          THANKS_URL = 'https://brooks-photonics.com/thanks/'
          CLASS_OLD = 'class-confirmation.html'
          CLASS_ROUTE = '/class/confirmation/'
          CLASS_URL = 'https://brooks-photonics.com/class/confirmation/'

          def root_assets(html: str) -> str:
              return (html
                      .replace('href="assets/', 'href="/assets/')
                      .replace('src="assets/', 'src="/assets/'))

          def redirect_page(title: str, route: str, canonical: str, label: str) -> str:
              return f'''<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8"/>\n<meta name="viewport" content="width=device-width, initial-scale=1.0"/>\n<meta name="robots" content="noindex,follow"/>\n<title>Redirecting - {title}</title>\n<link rel="canonical" href="{canonical}"/>\n<meta http-equiv="refresh" content="0; url={route}"/>\n<script>\n(function () {{\n  var target = '{route}' + window.location.search + window.location.hash;\n  window.location.replace(target);\n}})();\n</script>\n</head>\n<body>\n<p><a href="{route}">Continue to {label}</a></p>\n</body>\n</html>\n'''

          # Build the new canonical case-study page.
          case_src = Path(CASE_OLD).read_text(encoding='utf-8')
          case_new = root_assets(case_src)
          case_new = case_new.replace(
              'https://brooks-photonics.com/case-study-wfc3-ir-ramp.html', CASE_URL
          )
          case_dest = Path('case-studies/wfc3-ir-ramp/index.html')
          case_dest.parent.mkdir(parents=True, exist_ok=True)
          case_dest.write_text(case_new, encoding='utf-8')

          # Build the clean inquiry confirmation page. Status pages are intentionally noindex.
          thanks_src = root_assets(Path(THANKS_OLD).read_text(encoding='utf-8'))
          thanks_src = thanks_src.replace(
              '<meta name="description" content="Confirmation that a Brooks Photonics contact inquiry was submitted.">',
              '<meta name="description" content="Confirmation that a Brooks Photonics contact inquiry was submitted.">\n<meta name="robots" content="noindex,follow">\n<link rel="canonical" href="https://brooks-photonics.com/thanks/">'
          )
          thanks_src = thanks_src.replace('content="8;url=index.html"', 'content="8;url=/"')
          thanks_dest = Path('thanks/index.html')
          thanks_dest.parent.mkdir(parents=True, exist_ok=True)
          thanks_dest.write_text(thanks_src, encoding='utf-8')

          # Build the clean class confirmation page. It is also a transaction/status page.
          class_src = root_assets(Path(CLASS_OLD).read_text(encoding='utf-8'))
          class_src = class_src.replace(
              '<meta name="description" content="Complete registration and calendar setup for a Brooks Photonics class.">',
              '<meta name="description" content="Complete registration and calendar setup for a Brooks Photonics class.">\n<meta name="robots" content="noindex,follow">\n<link rel="canonical" href="https://brooks-photonics.com/class/confirmation/">'
          )
          class_dest = Path('class/confirmation/index.html')
          class_dest.parent.mkdir(parents=True, exist_ok=True)
          class_dest.write_text(class_src, encoding='utf-8')

          # Update every exact reference to the three legacy public URLs.
          replacements = [
              ('https://brooks-photonics.com/' + CASE_OLD, CASE_URL),
              ('../' + CASE_OLD, CASE_ROUTE),
              ('./' + CASE_OLD, CASE_ROUTE),
              ('/' + CASE_OLD, CASE_ROUTE),
              (CASE_OLD, CASE_ROUTE),
              ('https://brooks-photonics.com/' + THANKS_OLD, THANKS_URL),
              ('../' + THANKS_OLD, THANKS_ROUTE),
              ('./' + THANKS_OLD, THANKS_ROUTE),
              ('/' + THANKS_OLD, THANKS_ROUTE),
              (THANKS_OLD, THANKS_ROUTE),
              ('https://brooks-photonics.com/' + CLASS_OLD, CLASS_URL),
              ('../' + CLASS_OLD, CLASS_ROUTE),
              ('./' + CLASS_OLD, CLASS_ROUTE),
              ('/' + CLASS_OLD, CLASS_ROUTE),
              (CLASS_OLD, CLASS_ROUTE),
          ]

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts:
                  continue
              if path.suffix.lower() not in {'.html', '.xml', '.json'}:
                  continue
              text = path.read_text(encoding='utf-8')
              new = text
              for old, repl in replacements:
                  new = new.replace(old, repl)
              if new != text:
                  path.write_text(new, encoding='utf-8')

          # Restore the three old paths as compatibility redirects after global replacement.
          Path(CASE_OLD).write_text(
              redirect_page(
                  'Changing Background vs Detector Response | Brooks Photonics',
                  CASE_ROUTE, CASE_URL, 'the case study'
              ), encoding='utf-8'
          )
          Path(THANKS_OLD).write_text(
              redirect_page('Thank You - Brooks Photonics', THANKS_ROUTE, THANKS_URL, 'the confirmation page'),
              encoding='utf-8'
          )
          Path(CLASS_OLD).write_text(
              redirect_page('Class Confirmation - Brooks Photonics', CLASS_ROUTE, CLASS_URL, 'class confirmation'),
              encoding='utf-8'
          )

          # Validation: canonical destinations, metadata, form return route, and sitemap.
          case_text = case_dest.read_text(encoding='utf-8')
          assert f'rel="canonical" href="{CASE_URL}"' in case_text
          assert f'property="og:url" content="{CASE_URL}"' in case_text
          assert f'"mainEntityOfPage": "{CASE_URL}"' in case_text
          assert 'href="assets/' not in case_text and 'src="assets/' not in case_text

          thanks_text = thanks_dest.read_text(encoding='utf-8')
          assert 'name="robots" content="noindex,follow"' in thanks_text
          assert f'rel="canonical" href="{THANKS_URL}"' in thanks_text
          assert 'content="8;url=/"' in thanks_text
          assert 'href="assets/' not in thanks_text and 'src="assets/' not in thanks_text

          class_text = class_dest.read_text(encoding='utf-8')
          assert 'name="robots" content="noindex,follow"' in class_text
          assert f'rel="canonical" href="{CLASS_URL}"' in class_text
          assert 'href="/assets/class/infrared_class.ics"' in class_text
          assert 'href="assets/' not in class_text and 'src="assets/' not in class_text

          contact = Path('contact/index.html').read_text(encoding='utf-8')
          assert 'https://brooks-photonics.com/thanks/' in contact

          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          assert CASE_URL in sitemap
          assert 'case-study-wfc3-ir-ramp.html' not in sitemap
          assert THANKS_URL not in sitemap
          assert CLASS_URL not in sitemap

          for old, route in [(CASE_OLD, CASE_ROUTE), (THANKS_OLD, THANKS_ROUTE), (CLASS_OLD, CLASS_ROUTE)]:
              stub = Path(old).read_text(encoding='utf-8')
              assert 'name="robots" content="noindex,follow"' in stub
              assert f'content="0; url={route}"' in stub

          # One-shot migration workflow removes itself after a successful transformation.
          wf = Path('.github/workflows/phase3-clean-secondary-routes.yml')
          if wf.exists():
              wf.unlink()
          PY

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate remaining public pages to clean URLs"
          git pull --rebase origin main
          git push origin HEAD:main
