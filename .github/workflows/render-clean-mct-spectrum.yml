name: Render clean MCT spectrum

on:
  push:
    branches:
      - agent/render-clean-mct-spectrum
    paths:
      - .github/render-clean-mct-spectrum.trigger

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/render-clean-mct-spectrum
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plotting dependencies
        run: python -m pip install --disable-pip-version-check numpy matplotlib
      - name: Render spectrum SVG
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import matplotlib as mpl
          import matplotlib.pyplot as plt
          from matplotlib.ticker import LogLocator, LogFormatterMathtext

          mpl.rcParams['svg.fonttype'] = 'path'
          mpl.rcParams['font.family'] = 'DejaVu Sans'
          mpl.rcParams['mathtext.fontset'] = 'dejavusans'

          f = np.logspace(2, 8, 1800)
          fc = 1.7e5
          s_flicker = 1.84e-9 / f**1.9
          s_gr = (2.00e-7)**2 / (1.0 + (f / fc)**2)
          s_johnson = (2.00e-8)**2
          e_total = np.sqrt(s_flicker + s_gr + s_johnson)
          e_corner = np.sqrt(1.84e-9 / fc**1.9 + (2.00e-7)**2 / 2.0 + s_johnson)

          fig, ax = plt.subplots(figsize=(10.8, 6.5))
          fig.patch.set_facecolor('white')
          ax.set_facecolor('white')
          fig.subplots_adjust(left=0.105, right=0.985, bottom=0.13, top=0.91)

          ax.set_xscale('log')
          ax.set_yscale('log')
          ax.set_xlim(1e2, 1e8)
          ax.set_ylim(1e-8, 1e-6)

          ax.xaxis.set_major_locator(LogLocator(base=10, numticks=8))
          ax.xaxis.set_minor_locator(LogLocator(base=10, subs=np.arange(2, 10) * 0.1, numticks=100))
          ax.yaxis.set_major_locator(LogLocator(base=10, numticks=4))
          ax.yaxis.set_minor_locator(LogLocator(base=10, subs=np.arange(2, 10) * 0.1, numticks=100))
          ax.xaxis.set_major_formatter(LogFormatterMathtext())
          ax.yaxis.set_major_formatter(LogFormatterMathtext())
          ax.grid(which='major', color='#96999d', linestyle='--', linewidth=0.8, alpha=0.72)
          ax.grid(which='minor', color='#b4b7ba', linestyle='--', linewidth=0.55, alpha=0.62)

          ax.axvspan(1e3, 1e4, facecolor='#7bcf83', alpha=0.32,
                     edgecolor='#4fa457', hatch='//', linewidth=0, zorder=0)
          ax.plot(f, e_total, color='#171dd8', linewidth=2.65,
                  label='Total Noise', zorder=4)
          ax.hlines(e_corner, 1e2, fc, color='#ff00ff', linewidth=1.35,
                    linestyles=(0, (5, 4)), zorder=2)
          ax.vlines(fc, 1e-8, e_corner, color='#ff00ff', linewidth=1.35,
                    linestyles=(0, (5, 4)), zorder=2)
          ax.scatter([fc], [e_corner], s=52, color='#ff00ff', zorder=5)

          ax.set_title('Photodetector Noise Model', fontsize=15.5, fontweight='semibold', pad=12)
          ax.set_xlabel('Frequency (Hz)', fontsize=11.5, labelpad=10)
          ax.set_ylabel(r'Noise amplitude spectral density (V/$\sqrt{\mathrm{Hz}}$)',
                        fontsize=11.5, labelpad=9)

          equation = (r'$e_n(f)=\left[\frac{1.84\times10^{-9}}{f^{1.9}}+'
                      r'\frac{(2.00\times10^{-7})^2}{1+(f/1.7\times10^5)^2}+'
                      r'(2.00\times10^{-8})^2\right]^{1/2}$')
          ax.text(0.018, 0.975, equation, transform=ax.transAxes,
                  fontsize=9.8, va='top', ha='left')

          ax.text(4.5e2, 3.35e-7, '1/f Region', fontsize=13.2,
                  fontweight='bold', ha='left')
          ax.text(4.5e2, 2.62e-7, r'$S_{1/f}(f)=A/f^{\alpha}$',
                  fontsize=10.4, ha='left')

          ax.text(4.6e5, 1.92e-7, 'GR Region', fontsize=13.2,
                  fontweight='bold', ha='left')
          ax.text(4.6e5, 1.46e-7,
                  r'$S_{\mathrm{GR}}(f)=B/[1+(f/f_c)^2]$',
                  fontsize=10.3, ha='left',
                  bbox=dict(facecolor='white', edgecolor='none', alpha=0.78, pad=1.0))

          ax.text(2.15e5, 1.06e-7, r'$f_c=1.7\times10^5\ \mathrm{Hz}$',
                  fontsize=10.2, ha='left',
                  bbox=dict(facecolor='white', edgecolor='none', alpha=0.80, pad=0.8))
          ax.text(3.6e4, 6.8e-8, r'$\tau_{\mathrm{eff}}=1/(2\pi f_c)$',
                  fontsize=10.2, color='#d600d6', ha='left',
                  bbox=dict(facecolor='white', edgecolor='none', alpha=0.80, pad=0.8))

          ax.text(5.5e6, 3.25e-8, 'Johnson Region', fontsize=13.2,
                  fontweight='bold', ha='left')
          ax.text(6.8e6, 2.48e-8, r'$e_J=\sqrt{4k_{\mathrm{B}}TR}$',
                  fontsize=10.4, ha='left',
                  bbox=dict(facecolor='white', edgecolor='none', alpha=0.76, pad=0.8))

          ax.text(3.16e3, 1.18e-8, 'typical 1–10 kHz test band',
                  fontsize=10.0, fontweight='bold', ha='center', va='bottom')
          ax.text(1.28e2, 1.06e-8,
                  'Note: Parameter values are illustrative and are not intended as rigorous physical constants.',
                  fontsize=7.3, color='#686b6e', ha='left', va='bottom')

          legend = ax.legend(loc='upper right', frameon=True, fontsize=9.8,
                             borderpad=0.8, handlelength=2.6)
          legend.get_frame().set_facecolor('white')
          legend.get_frame().set_edgecolor('#bfc2c5')
          legend.get_frame().set_alpha(1.0)

          for spine in ax.spines.values():
              spine.set_color('#242424')
              spine.set_linewidth(1.0)
          ax.tick_params(axis='both', which='major', labelsize=9.4, width=0.8)
          ax.tick_params(axis='both', which='minor', width=0.55)

          output = Path('assets/images/mct-noise-spectrum.svg')
          fig.savefig(output, format='svg', facecolor='white')
          plt.close(fig)

          Path('.github/render-clean-mct-spectrum.trigger').unlink(missing_ok=True)
          Path('.github/workflows/render-clean-mct-spectrum.yml').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Render clean MCT spectrum annotations"
          git push origin HEAD:agent/render-clean-mct-spectrum
