name: Install final favicon

on:
  push:
    branches:
      - agent/install-final-favicon
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/install-final-favicon

      - name: Update favicon declarations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          icon = '<link href="/favicon-96x96.png" rel="icon" sizes="96x96" type="image/png"/>'

          for path in sorted(Path('.').rglob('*.html')):
              text = path.read_text(encoding='utf-8')
              original = text
              text = re.sub(r'\s*<link[^>]+rel=["\']icon["\'][^>]*/?>', '', text)
              viewport = re.search(r'(<meta[^>]+name=["\']viewport["\'][^>]*/?>)', text)
              charset = re.search(r'(<meta[^>]+charset=["\'][^"\']+["\'][^>]*/?>)', text)
              anchor = viewport or charset
              if not anchor:
                  raise RuntimeError(f'No head insertion anchor in {path}')
              text = text[:anchor.end()] + '\n' + icon + text[anchor.end():]
              if text != original:
                  path.write_text(text, encoding='utf-8')

          for path in sorted(Path('.').rglob('*.html')):
              text = path.read_text(encoding='utf-8')
              assert text.count(icon) == 1, f'{path}: PNG declaration mismatch'
              assert 'Brooks_Photonics_Logo.png" rel="icon' not in text
              assert '/favicon.ico' not in text
          PY

      - name: Validate favicon file
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import struct

          png = Path('favicon-96x96.png').read_bytes()
          assert png[:8] == b'\x89PNG\r\n\x1a\n'
          width, height = struct.unpack('>II', png[16:24])
          assert (width, height) == (96, 96)
          assert len(png) == 13228
          assert hashlib.sha256(png).hexdigest() == '244ac044fecd7fa205c11429f9b12e2fffeefac1a99e36481abf8179fedb039d'
          PY

      - name: Commit favicon installation
        run: |
          rm -f favicon.ico
          rm -rf .favicon-parts .github/workflows/install-final-favicon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install dedicated Brooks Photonics favicon"
          git push
