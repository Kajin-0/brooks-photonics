name: Install visible footer logo on release branch

on:
  push:
    branches:
      - fix/footer-logo-release-v3

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/footer-logo-release-v3

      - name: Install cache-busted white footer logo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          image_b64 = """"""
          image_path = Path("assets/images/Brooks_Photonics_Logo_Footer_White_v3.png")
          image_path.write_bytes(base64.b64decode(image_b64))

          old = "Brooks_Photonics_Logo_Wht.png"
          new = "Brooks_Photonics_Logo_Footer_White_v3.png"
          changed = []
          for path in Path(".").rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  changed.append(str(path))

          if not changed:
              raise RuntimeError("No footer logo references were updated")
          print("Updated footer logo references:")
          print("\n".join(changed))
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/install-footer-logo-release-v3.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install visible cache-busted white footer logo"
          git push origin HEAD:fix/footer-logo-release-v3
