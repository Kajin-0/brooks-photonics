name: Fix footer logo rendering

on:
  push:
    branches:
      - fix/footer-logo-css-white

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/footer-logo-css-white
      - name: Restore valid logo source and render it white in footers
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = (
              "Brooks_Photonics_Logo_Footer_White_v3.png",
              "Brooks_Photonics_Logo_Wht.png",
              "Brooks_Photonics_Logo_Footer_White_v2.png",
          )

          changed = 0
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text
              for old in replacements:
                  text = text.replace(old, 'Brooks_Photonics_Logo.png')
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed += 1

          css_path = Path('assets/css/style.css')
          css = css_path.read_text(encoding='utf-8')
          rule = '.brand-footer .logo { filter: brightness(0) invert(1); }'
          if rule not in css:
              anchor = '.brand-footer { color: #fff; }'
              if anchor not in css:
                  raise RuntimeError('Footer CSS anchor not found')
              css = css.replace(anchor, anchor + '\n' + rule, 1)
              css_path.write_text(css, encoding='utf-8')

          if changed == 0:
              raise RuntimeError('No footer references were repaired')
          PY
      - name: Remove one-time workflow
        run: git rm .github/workflows/fix-footer-logo-css-white.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix footer logo using valid source and CSS white treatment"
          git push
