name: Repair direct NASD workflow

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/direct-nasd-quadrature-model
    paths:
      - .github/repair-direct-nasd-workflow.trigger

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/direct-nasd-quadrature-model' || github.ref == 'refs/heads/agent/direct-nasd-quadrature-model'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/direct-nasd-quadrature-model
          fetch-depth: 0
      - name: Preserve LaTeX in regex replacements
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/direct-nasd-quadrature.yml')
          text = path.read_text(encoding='utf-8')
          old = "text, count = re.subn(pattern, replacement, text, count=1, flags=flags)"
          new = "text, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one helper line, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/repair-direct-nasd-workflow.trigger').unlink(missing_ok=True)
          Path('.github/workflows/repair-direct-nasd-workflow.yml').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve LaTeX in NASD replacements"
          git push origin HEAD:agent/direct-nasd-quadrature-model
