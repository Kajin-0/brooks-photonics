name: Sync social previews

on:
  push:
    branches:
      - main
    paths:
      - "posts/posts.json"
      - "posts/*/index.html"
      - "scripts/social_previews.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync social metadata from posts.json
        run: python scripts/social_previews.py --fix

      - name: Commit synchronized metadata if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Social preview metadata is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/*/index.html
          git commit -m "Sync social preview metadata"
          git push
