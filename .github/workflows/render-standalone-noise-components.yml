name: Render standalone noise component plots

on:
  push:
    branches:
      - feature/standalone-noise-component-plots

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/standalone-noise-component-plots

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install plotting dependencies
        run: python -m pip install --disable-pip-version-check numpy matplotlib

      - name: Generate plots and update article
        run: python scripts/generate_noise_component_plots.py

      - name: Remove one-time workflow
        run: rm .github/workflows/render-standalone-noise-components.yml

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add standalone 1/f, GR, and Johnson noise plots"
          git push origin HEAD:feature/standalone-noise-component-plots
