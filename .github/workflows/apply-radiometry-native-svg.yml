name: Apply native radiometry SVG figures

on:
  push:
    branches:
      - draft/radiometry-source-to-detector
    paths:
      - .github/workflows/apply-radiometry-native-svg.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft/radiometry-source-to-detector
      - name: Switch article to native SVG figures
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('posts/radiometry-source-radiance-to-detector-signal/index.html')
          s = p.read_text()

          replacements = {
              '.article-figure img{display:block;width:100%;height:auto}':
              '.article-figure img{display:block;width:auto;max-width:min(100%,1000px);height:auto;margin:0 auto}',

              'src="../../assets/images/radiometry/radiance-to-detector-signal.webp" alt="Source radiance passes through accepted area-angle throughput and transmission to detector power, then responsivity converts it to electrical signal." width="1000" height="546" decoding="async"':
              'src="../../assets/images/radiometry/radiance-to-detector-signal.svg" alt="Source radiance passes through accepted area-angle throughput and transmission to detector power, then responsivity converts it to electrical signal." width="1448" height="1086" decoding="async"',

              'src="../../assets/images/radiometry/lambertian-cosine-projection.webp" alt="Lambertian surface emitting into a hemisphere, with an oblique ray showing the projected area dA cos theta." width="1000" height="750" decoding="async"':
              'src="../../assets/images/radiometry/lambertian-cosine-projection.svg" alt="Lambertian surface emitting into a hemisphere, with an oblique ray showing the projected area dA cos theta." width="1448" height="1086" decoding="async"',

              'src="../../assets/images/radiometry/three-collection-regimes.webp" alt="Three radiometric collection regimes: a finite source viewed by a bare detector, a field-filling source, and an imaging system." width="900" height="500" decoding="async"':
              'src="../../assets/images/radiometry/three-collection-regimes.svg" alt="Three radiometric collection regimes: a finite source viewed by a bare detector, a field-filling source, and an imaging system." width="1448" height="1086" decoding="async"',

              'src="../../assets/images/radiometry/worked-example-500k.webp" alt="A 500 kelvin blackbody aperture separated from a small detector by 250 millimeters, beside a spectral-radiance curve with the 8 to 12 micrometer band highlighted." width="900" height="675" decoding="async"':
              'src="../../assets/images/radiometry/worked-example-500k.svg" alt="A 500 kelvin blackbody aperture separated from a small detector by 250 millimeters, beside a spectral-radiance curve with the 8 to 12 micrometer band highlighted." width="1448" height="1086" decoding="async"',
          }

          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:90]}')
              s = s.replace(old, new)

          p.write_text(s)
          PY
      - name: Verify figure integration
        run: |
          git diff --check
          grep -q 'radiance-to-detector-signal.svg' posts/radiometry-source-radiance-to-detector-signal/index.html
          grep -q 'lambertian-cosine-projection.svg' posts/radiometry-source-radiance-to-detector-signal/index.html
          grep -q 'three-collection-regimes.svg' posts/radiometry-source-radiance-to-detector-signal/index.html
          grep -q 'worked-example-500k.svg' posts/radiometry-source-radiance-to-detector-signal/index.html
          ! grep -q 'assets/images/radiometry/.*\.webp' posts/radiometry-source-radiance-to-detector-signal/index.html
          git diff -- posts/radiometry-source-radiance-to-detector-signal/index.html
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/radiometry-source-radiance-to-detector-signal/index.html
          git commit -m "Use native SVG radiometry figures"
          git push origin HEAD:draft/radiometry-source-to-detector
