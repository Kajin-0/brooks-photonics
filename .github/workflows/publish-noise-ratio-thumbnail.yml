name: Publish noise-ratio social thumbnail

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-noise-ratio-thumbnail.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install render tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin python3-pil

      - name: Render existing article figure
        run: |
          set -euo pipefail
          mkdir -p /tmp/noise-ratio
          rsvg-convert --width 1016 --height 630 \
            assets/images/two-frequency-noise-ratio.svg \
            > /tmp/noise-ratio/figure.png
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Image.open('/tmp/noise-ratio/figure.png').convert('RGB')
          canvas = Image.new('RGB', (1200, 630), 'white')
          canvas.paste(source, ((1200 - source.width) // 2, 0))
          output = Path('assets/images/two-frequency-noise-ratio-social.png')
          canvas.save(output, 'PNG', optimize=True)
          assert Image.open(output).size == (1200, 630)
          PY

      - name: Add social metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('posts/photoconductor-noise-ratio.html')
          text = path.read_text(encoding='utf-8')
          image_url = 'https://brooks-photonics.com/assets/images/two-frequency-noise-ratio-social.png'

          if 'two-frequency-noise-ratio-social.png' not in text:
              canonical = '<link rel="canonical" href="https://brooks-photonics.com/posts/photoconductor-noise-ratio.html"/>\n'
              social = canonical + (
                  '<meta property="og:type" content="article"/>\n'
                  '<meta property="og:site_name" content="Brooks Photonics"/>\n'
                  '<meta property="og:title" content="What a Two-Frequency Noise Ratio Can Reveal About a Photoconductor"/>\n'
                  '<meta property="og:description" content="A practical, model-light method for comparing low-frequency excess noise using a lower test frequency and a higher flat-band reference."/>\n'
                  '<meta property="og:url" content="https://brooks-photonics.com/posts/photoconductor-noise-ratio.html"/>\n'
                  f'<meta property="og:image" content="{image_url}"/>\n'
                  '<meta property="og:image:type" content="image/png"/>\n'
                  '<meta property="og:image:width" content="1200"/>\n'
                  '<meta property="og:image:height" content="630"/>\n'
                  '<meta property="og:image:alt" content="Two-frequency detector comparison showing similar high-frequency noise but different low-frequency excess noise"/>\n'
                  '<meta name="twitter:card" content="summary_large_image"/>\n'
                  '<meta name="twitter:title" content="What a Two-Frequency Noise Ratio Can Reveal About a Photoconductor"/>\n'
                  '<meta name="twitter:description" content="A two-frequency method for exposing low-frequency excess noise without assuming an ideal 1/f spectrum."/>\n'
                  f'<meta name="twitter:image" content="{image_url}"/>\n'
                  '<meta name="twitter:image:alt" content="Two-frequency photoconductor noise comparison"/>\n'
              )
              if text.count(canonical) != 1:
                  raise SystemExit('Expected one canonical link')
              text = text.replace(canonical, social, 1)

              published = '  "datePublished": "2026-08-02",\n'
              structured = published + f'  "image": "{image_url}",\n'
              if text.count(published) != 1:
                  raise SystemExit('Expected one publication date')
              text = text.replace(published, structured, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate and publish
        run: |
          set -euo pipefail
          test -s assets/images/two-frequency-noise-ratio-social.png
          file assets/images/two-frequency-noise-ratio-social.png | grep -q '1200 x 630'
          grep -q 'og:image.*two-frequency-noise-ratio-social.png' posts/photoconductor-noise-ratio.html
          grep -q 'twitter:card.*summary_large_image' posts/photoconductor-noise-ratio.html
          grep -q 'twitter:image.*two-frequency-noise-ratio-social.png' posts/photoconductor-noise-ratio.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-noise-ratio-thumbnail.yml
          git add assets/images/two-frequency-noise-ratio-social.png posts/photoconductor-noise-ratio.html
          git commit -m "Use article figure as social thumbnail"
          git push origin HEAD:main
