name: Render noise spectrum once

on:
  push:
    branches:
      - fix/remove-inline-f3db-label

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-inline-f3db-label

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check numpy matplotlib

      - run: python scripts/generate_mct_noise_spectrum.py

      - name: Commit regenerated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/mct-noise-spectrum.svg
          if git diff --cached --quiet; then
            echo "No SVG changes to commit"
          else
            git commit -m "Regenerate noise spectrum without inline frequency label"
            git push origin HEAD:fix/remove-inline-f3db-label
          fi
