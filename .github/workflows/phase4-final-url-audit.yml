name: Phase 4 final URL and SEO audit

on:
  push:
    paths:
      - '.github/workflows/phase4-final-url-audit.yml'

permissions:
  contents: write

concurrency:
  group: phase4-final-url-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Normalize remaining public URL references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_many(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  p.write_text(text, encoding='utf-8')

          # 404 page must point directly at canonical routes.
          replace_many('404.html', [
              ('/index.html', '/'),
              ('/about.html', '/about/'),
              ('/services.html', '/services/'),
              ('/class.html', '/class/'),
              ('/utilities.html', '/utilities/'),
              ('/posts.html', '/posts/'),
              ('/contact.html', '/contact/'),
          ])

          # Public navigation to utility subpages should use their directory routes.
          for page in ('utilities/index.html', 'class/index.html'):
              replace_many(page, [
                  ('/utilities/test-measurement-sim/index.html', '/utilities/test-measurement-sim/'),
                  ('/utilities/worksheet/index.html', '/utilities/worksheet/'),
              ])

          # Worksheet: repair root asset paths, clean simulator links, remove dead JS request,
          # and define its canonical URL.
          p = Path('utilities/worksheet/index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('..//assets/css/style.css', '/assets/css/style.css')
          text = text.replace('..//assets/images/Brooks_Photonics_Logo.png', '/assets/images/Brooks_Photonics_Logo.png')
          text = text.replace('../test-measurement-sim/index.html', '/utilities/test-measurement-sim/')
          dead_script = '''  <script\n    src="../webinar-access.js"\n    data-webinar-gate\n    data-gate-class-href="/class/"\n  ></script>\n'''
          text = text.replace(dead_script, '')
          canonical = '  <link rel="canonical" href="https://brooks-photonics.com/utilities/worksheet/">\n'
          if 'rel="canonical"' not in text:
              text = text.replace('  <title>MCT Photoconductor Webinar — Student Worksheet | Brooks Photonics</title>\n',
                                  '  <title>MCT Photoconductor Webinar — Student Worksheet | Brooks Photonics</title>\n' + canonical)
          p.write_text(text, encoding='utf-8')

          # Simulator already has a directory route; make that route explicit for crawlers.
          p = Path('utilities/test-measurement-sim/index.html')
          text = p.read_text(encoding='utf-8')
          if 'rel="canonical"' not in text:
              text = text.replace('    <title>MCT test-bench simulator | Brooks Photonics</title>\n',
                                  '    <title>MCT test-bench simulator | Brooks Photonics</title>\n    <link rel="canonical" href="https://brooks-photonics.com/utilities/test-measurement-sim/" />\n')
          p.write_text(text, encoding='utf-8')

          # Every indexable canonical page belongs in the sitemap.
          p = Path('sitemap.xml')
          text = p.read_text(encoding='utf-8')
          marker = '  <url><loc>https://brooks-photonics.com/utilities/</loc></url>\n'
          additions = (
              '  <url><loc>https://brooks-photonics.com/utilities/test-measurement-sim/</loc></url>\n'
              '  <url><loc>https://brooks-photonics.com/utilities/worksheet/</loc></url>\n'
          )
          if 'https://brooks-photonics.com/utilities/test-measurement-sim/' not in text:
              text = text.replace(marker, marker + additions)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate clean URL architecture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          errors = []

          expected_canonicals = {
              'index.html': 'https://brooks-photonics.com/',
              'about/index.html': 'https://brooks-photonics.com/about/',
              'services/index.html': 'https://brooks-photonics.com/services/',
              'contact/index.html': 'https://brooks-photonics.com/contact/',
              'class/index.html': 'https://brooks-photonics.com/class/',
              'utilities/index.html': 'https://brooks-photonics.com/utilities/',
              'posts/index.html': 'https://brooks-photonics.com/posts/',
              'case-studies/wfc3-ir-ramp/index.html': 'https://brooks-photonics.com/case-studies/wfc3-ir-ramp/',
              'posts/photoconductor-noise-ratio/index.html': 'https://brooks-photonics.com/posts/photoconductor-noise-ratio/',
              'posts/how-to-read-photodetector-noise-spectrum/index.html': 'https://brooks-photonics.com/posts/how-to-read-photodetector-noise-spectrum/',
              'posts/lock-in-noise-enbw/index.html': 'https://brooks-photonics.com/posts/lock-in-noise-enbw/',
              'utilities/test-measurement-sim/index.html': 'https://brooks-photonics.com/utilities/test-measurement-sim/',
              'utilities/worksheet/index.html': 'https://brooks-photonics.com/utilities/worksheet/',
              'thanks/index.html': 'https://brooks-photonics.com/thanks/',
              'class/confirmation/index.html': 'https://brooks-photonics.com/class/confirmation/',
          }

          for path, url in expected_canonicals.items():
              p = Path(path)
              if not p.exists():
                  errors.append(f'missing canonical page: {path}')
                  continue
              text = p.read_text(encoding='utf-8')
              if f'rel="canonical" href="{url}"' not in text and f'href="{url}" rel="canonical"' not in text:
                  errors.append(f'canonical mismatch: {path} -> {url}')

          # Status pages should not be indexed.
          for path in ('thanks/index.html', 'class/confirmation/index.html'):
              text = Path(path).read_text(encoding='utf-8')
              if 'noindex,follow' not in text:
                  errors.append(f'status page missing noindex: {path}')

          # Legacy files are retained only as redirects.
          legacy = [
              'about.html', 'services.html', 'contact.html', 'class.html', 'utilities.html', 'posts.html',
              'case-study-wfc3-ir-ramp.html', 'thanks.html', 'class-confirmation.html',
              'posts/photoconductor-noise-ratio.html',
              'posts/how-to-read-photodetector-noise-spectrum.html',
              'posts/lock-in-noise-enbw.html',
          ]
          for path in legacy:
              p = Path(path)
              if not p.exists():
                  errors.append(f'missing compatibility redirect: {path}')
                  continue
              text = p.read_text(encoding='utf-8')
              if 'noindex,follow' not in text or 'http-equiv="refresh"' not in text or 'rel="canonical"' not in text:
                  errors.append(f'incomplete compatibility redirect: {path}')

          # Canonical/public pages must not link internally to .html routes.
          skip = set(legacy)
          attr_re = re.compile(r'(?:href|src|action|data)=["\']([^"\']+)["\']', re.I)
          for p in Path('.').rglob('*.html'):
              rel = p.as_posix()
              if rel in skip:
                  continue
              text = p.read_text(encoding='utf-8', errors='ignore')
              for url in attr_re.findall(text):
                  if url.startswith(('http://', 'https://', 'mailto:', 'tel:', '#', 'data:', 'javascript:')):
                      continue
                  clean = url.split('?', 1)[0].split('#', 1)[0]
                  if clean.endswith('.html'):
                      errors.append(f'legacy internal HTML link in {rel}: {url}')

          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          if '.html' in sitemap:
              errors.append('sitemap still contains .html URL')
          for url in expected_canonicals.values():
              if url in ('https://brooks-photonics.com/thanks/', 'https://brooks-photonics.com/class/confirmation/'):
                  continue
              if url not in sitemap:
                  errors.append(f'canonical indexable URL missing from sitemap: {url}')

          robots = Path('robots.txt').read_text(encoding='utf-8')
          if 'Sitemap: https://brooks-photonics.com/sitemap.xml' not in robots:
              errors.append('robots.txt does not advertise canonical sitemap')

          worksheet = Path('utilities/worksheet/index.html').read_text(encoding='utf-8')
          if '..//assets/' in worksheet:
              errors.append('worksheet still contains broken ..//assets paths')
          if 'webinar-access.js' in worksheet:
              errors.append('worksheet still requests missing webinar-access.js')

          if errors:
              print('\n'.join(f'ERROR: {e}' for e in errors))
              sys.exit(1)

          print('Phase 4 URL/SEO validation passed.')
          PY

      - name: Commit Phase 4 cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase4-final-url-audit.yml
          git add 404.html class/index.html utilities/index.html utilities/worksheet/index.html utilities/test-measurement-sim/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Phase 4 changes are already applied."
            exit 0
          fi
          git commit -m "Complete clean URL migration and final SEO audit"
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin HEAD:"${TARGET_BRANCH}"
