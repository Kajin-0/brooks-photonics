name: Fix mobile MCT model equation

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-mct-model-equation.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Patch only the three-region model equation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('posts/how-to-read-photodetector-noise-spectrum/index.html')
          text = p.read_text(encoding='utf-8')

          old_css = '''@media(max-width:900px){
 body .article-layout{grid-template-areas:"toc" "article"}
 .region-grid{grid-template-columns:1fr}
 .quick-reference .math-display{font-size:.96rem}
}
'''
          new_css = '''.model-equation-mobile{display:none}
@media(max-width:900px){
 body .article-layout{grid-template-areas:"toc" "article"}
 .region-grid{grid-template-columns:1fr}
 .quick-reference .math-display{font-size:.96rem}
}
@media(max-width:620px){
 .quick-reference .model-equation-desktop{display:none}
 .quick-reference .model-equation-mobile{display:block;max-width:100%;overflow-x:auto;font-size:1rem;line-height:1.25;-webkit-overflow-scrolling:touch}
 .quick-reference .model-equation-mobile mjx-container[display="true"]{margin:.25em 0!important}
}
'''
          if old_css not in text:
              raise SystemExit('Expected article CSS block not found; refusing broad edit.')
          text = text.replace(old_css, new_css, 1)

          old_eq = '''<section class="quick-reference" id="model" aria-labelledby="quick-reference-title"><h2 id="quick-reference-title">Three-region MCT noise model</h2><div class="math-display">\\[
\\begin{aligned}
e_n(f)&=\\sqrt{e_{1/f}^2(f)+e_{\\mathrm{GR}}^2(f)+e_J^2}\\\\[4pt]
&=\\left\\{\\left[A_{1/f}\\left(\\frac{f}{f_0}\\right)^{-\\beta}\\right]^2+\\left[\\frac{e_{\\mathrm{GR},0}}{\\sqrt{1+\\left(f/f_{-3\\mathrm{dB}}\\right)^2}}\\right]^2+e_J^2\\right\\}^{1/2}.
\\end{aligned}
\\]</div>'''
          new_eq = '''<section class="quick-reference" id="model" aria-labelledby="quick-reference-title"><h2 id="quick-reference-title">Three-region MCT noise model</h2><div class="math-display model-equation-desktop">\\[
\\begin{aligned}
e_n(f)&=\\sqrt{e_{1/f}^2(f)+e_{\\mathrm{GR}}^2(f)+e_J^2}\\\\[4pt]
&=\\left\\{\\left[A_{1/f}\\left(\\frac{f}{f_0}\\right)^{-\\beta}\\right]^2+\\left[\\frac{e_{\\mathrm{GR},0}}{\\sqrt{1+\\left(f/f_{-3\\mathrm{dB}}\\right)^2}}\\right]^2+e_J^2\\right\\}^{1/2}.
\\end{aligned}
\\]</div><div class="math-display model-equation-mobile" aria-label="Three-region MCT noise model">\\[
\\begin{aligned}
e_n(f)&=\\sqrt{e_{1/f}^2(f)+e_{\\mathrm{GR}}^2(f)+e_J^2}\\\\[6pt]
&=\\Bigg\\{\\left[A_{1/f}\\left(\\frac{f}{f_0}\\right)^{-\\beta}\\right]^2\\\\[3pt]
&\\qquad+\\left[\\frac{e_{\\mathrm{GR},0}}{\\sqrt{1+\\left(f/f_{-3\\mathrm{dB}}\\right)^2}}\\right]^2\\\\[3pt]
&\\qquad+e_J^2\\Bigg\\}^{1/2}.
\\end{aligned}
\\]</div>'''
          if old_eq not in text:
              raise SystemExit('Expected three-region equation not found; refusing broad edit.')
          text = text.replace(old_eq, new_eq, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate targeted mobile treatment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('posts/how-to-read-photodetector-noise-spectrum/index.html').read_text(encoding='utf-8')
          checks = [
              'model-equation-desktop',
              'model-equation-mobile',
              '@media(max-width:620px)',
              '.quick-reference .model-equation-desktop{display:none}',
              '+e_J^2\\Bigg\\}^{1/2}',
          ]
          missing = [x for x in checks if x not in text]
          if missing:
              raise SystemExit('Validation failed: ' + repr(missing))
          if text.count('Three-region MCT noise model') != 1:
              raise SystemExit('Unexpected duplicate model heading')
          print('Targeted mobile equation fix validated.')
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-mobile-mct-model-equation.yml
          git add posts/how-to-read-photodetector-noise-spectrum/index.html
          git commit -m "Fix three-region MCT equation on mobile"
          git pull --rebase origin main
          git push origin HEAD:main
