name: Apply Brooks Photonics wordmark typography

on:
  push:
    branches:
      - design/brand-wordmark-montserrat

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/brand-wordmark-montserrat
      - name: Update wordmark markup and typography
        run: python scripts/apply_brand_wordmark.py
      - name: Remove one-time migration files
        run: |
          rm scripts/apply_brand_wordmark.py
          rm .github/workflows/apply-brand-wordmark.yml
      - name: Commit wordmark update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use banner-derived Brooks Photonics wordmark"
          git push
