name: Fix MCT label overlap

on:
  push:
    branches:
      - agent/fix-mct-label-overlap
    paths:
      - .github/fix-mct-label-overlap.trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-mct-label-overlap
          fetch-depth: 0
      - name: Refine SVG annotation spacing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/images/mct-noise-spectrum.svg')
          text = path.read_text(encoding='utf-8')

          old_style = '.tick{font-size:13px}.axis-label{font-size:16px}.region{font-size:18px;font-weight:700}.formula{font-size:14px}.note{font-size:11px;fill:#6d7074}.model{font-size:15px}.legend{font-size:14px}'
          new_style = '.tick{font-size:13px}.axis-label{font-size:16px}.region{font-size:18px;font-weight:700}.formula{font-size:14px}.note{font-size:11px;fill:#6d7074}.model{font-size:15px}.legend{font-size:14px}.label-bg{fill:#fff;opacity:.9}'
          if old_style not in text:
              raise SystemExit('Expected SVG style block not found')
          text = text.replace(old_style, new_style, 1)

          old = '''<text class="region" x="670" y="300">GR Region</text>
<text class="formula" x="645" y="326">S<tspan baseline-shift="sub" font-size="11">GR</tspan>(f) = B/[1+(f/f<tspan baseline-shift="sub" font-size="11">c</tspan>)²]</text>
<text class="region" x="865" y="505">Johnson Region</text>
<text class="formula" x="882" y="531">e<tspan baseline-shift="sub" font-size="11">J</tspan> = √(4k<tspan baseline-shift="sub" font-size="11">B</tspan>TR)</text>
<text x="519.09" y="368.66" font-size="14" fill="#ff00ff">τ<tspan baseline-shift="sub" font-size="11">eff</tspan> = 1/(2πf<tspan baseline-shift="sub" font-size="11">c</tspan>)</text>
<text x="632.09" y="333.64" font-size="14">f<tspan baseline-shift="sub" font-size="11">c</tspan> = 1.7 × 10<tspan baseline-shift="super" font-size="11">5</tspan> Hz</text>'''

          new = '''<rect class="label-bg" x="678" y="218" width="300" height="72" rx="3"/>
<text class="region" x="690" y="246">GR Region</text>
<text class="formula" x="690" y="276">S<tspan baseline-shift="sub" font-size="11">GR</tspan>(f) = B/[1+(f/f<tspan baseline-shift="sub" font-size="11">c</tspan>)²]</text>
<rect class="label-bg" x="627" y="306" width="194" height="30" rx="3"/>
<text x="638" y="328" font-size="14">f<tspan baseline-shift="sub" font-size="11">c</tspan> = 1.7 × 10<tspan baseline-shift="super" font-size="11">5</tspan> Hz</text>
<rect class="label-bg" x="493" y="348" width="176" height="31" rx="3"/>
<text x="505" y="371" font-size="14" style="fill:#ff00ff">τ<tspan baseline-shift="sub" font-size="11">eff</tspan> = 1/(2πf<tspan baseline-shift="sub" font-size="11">c</tspan>)</text>
<rect class="label-bg" x="851" y="473" width="205" height="66" rx="3"/>
<text class="region" x="865" y="501">Johnson Region</text>
<text class="formula" x="882" y="529">e<tspan baseline-shift="sub" font-size="11">J</tspan> = √(4k<tspan baseline-shift="sub" font-size="11">B</tspan>TR)</text>'''

          if old not in text:
              raise SystemExit('Expected annotation block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          Path('.github/fix-mct-label-overlap.trigger').unlink(missing_ok=True)
          Path('.github/workflows/fix-mct-label-overlap.yml').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine MCT spectrum label spacing"
          git push origin HEAD:agent/fix-mct-label-overlap
