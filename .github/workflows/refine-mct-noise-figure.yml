name: Refine MCT noise figure

on:
  push:
    branches:
      - agent/final-mct-noise-figure

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-mct-noise-figure
          fetch-depth: 0
      - name: Refine article equation and spectrum figure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import math

          article_path = Path('posts/how-to-read-photodetector-noise-spectrum.html')
          article = article_path.read_text(encoding='utf-8')
          replacements = {
              '.quick-reference .math-display{margin:12px auto 0;overflow:visible;text-align:center;font-size:clamp(.72rem,1.65vw,1rem)}':
              '.quick-reference .math-display{margin:12px auto 0;overflow:visible;text-align:center;font-size:clamp(1.05rem,2.4vw,1.34rem);line-height:1.25}',
              '.quick-reference .math-display{font-size:.69rem}':
              '.quick-reference .math-display{font-size:.96rem}'
          }
          for old, new in replacements.items():
              if old not in article:
                  raise SystemExit(f'Expected article text not found: {old}')
              article = article.replace(old, new, 1)
          article_path.write_text(article, encoding='utf-8')

          W, H = 1100, 680
          x0, y0 = 95.0, 62.0
          pw, ph = 970.0, 548.0
          xmin, xmax = 1e2, 1e8
          ymin, ymax = 1e-8, 1e-6

          def sx(f):
              return x0 + (math.log10(f) - math.log10(xmin)) / (math.log10(xmax) - math.log10(xmin)) * pw

          def sy(v):
              return y0 + (math.log10(ymax) - math.log10(v)) / (math.log10(ymax) - math.log10(ymin)) * ph

          alpha = 1.9
          fc = 1.7e5
          A = 1.84e-9
          B = (2.00e-7) ** 2
          C = (2.00e-8) ** 2

          def total_asd(f):
              return math.sqrt(A / f**alpha + B / (1.0 + (f / fc) ** 2) + C)

          yc = total_asd(fc)
          out = []
          add = out.append
          add(f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {W} {H}" role="img" aria-labelledby="mct-title mct-desc">')
          add('<title id="mct-title">Photodetector noise model for an HgCdTe photoconductor</title>')
          add('<desc id="mct-desc">Log-log noise amplitude spectral density showing the one-over-f region, generation-recombination region and corner, Johnson region, and a shaded one to ten kilohertz test band.</desc>')
          add('<defs>')
          add(f'<clipPath id="plot-clip"><rect x="{x0}" y="{y0}" width="{pw}" height="{ph}"/></clipPath>')
          add('<pattern id="test-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><line x1="0" y1="0" x2="0" y2="12" stroke="#4fa457" stroke-width="2" opacity=".42"/></pattern>')
          add('</defs>')
          add('<style>text{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#171717}.axis{stroke:#252525;stroke-width:1.45}.major{stroke:#8f9296;stroke-width:.9;stroke-dasharray:5 4;opacity:.72}.minor{stroke:#a9adb1;stroke-width:.68;stroke-dasharray:3.5 4;opacity:.7}.tick{font-size:13px}.axis-label{font-size:16px}.region{font-size:18px;font-weight:700}.formula{font-size:14px}.note{font-size:11px;fill:#6d7074}.model{font-size:15px}.legend{font-size:14px}</style>')
          add('<rect width="1100" height="680" fill="#fff"/>')
          add('<text x="550" y="28" text-anchor="middle" font-size="21" font-weight="600">Photodetector Noise Model</text>')

          # Dense logarithmic grid.
          add('<g>')
          for decade in range(2, 9):
              x = sx(10**decade)
              add(f'<line class="major" x1="{x:.2f}" y1="{y0}" x2="{x:.2f}" y2="{y0+ph}"/>')
              if decade < 8:
                  for n in range(2, 10):
                      xm = sx(n * 10**decade)
                      add(f'<line class="minor" x1="{xm:.2f}" y1="{y0}" x2="{xm:.2f}" y2="{y0+ph}"/>')
          for decade in (-8, -7, -6):
              y = sy(10**decade)
              add(f'<line class="major" x1="{x0}" y1="{y:.2f}" x2="{x0+pw}" y2="{y:.2f}"/>')
              if decade < -6:
                  for n in range(2, 10):
                      ym = sy(n * 10**decade)
                      add(f'<line class="minor" x1="{x0}" y1="{ym:.2f}" x2="{x0+pw}" y2="{ym:.2f}"/>')
          add('</g>')

          # Shaded test band, limited to the lower portion as in the supplied figure.
          band_x1, band_x2 = sx(1e3), sx(1e4)
          band_y1, band_y2 = sy(2.2e-7), sy(1e-8)
          add(f'<rect x="{band_x1:.2f}" y="{band_y1:.2f}" width="{band_x2-band_x1:.2f}" height="{band_y2-band_y1:.2f}" fill="#75c97d" opacity=".32"/>')
          add(f'<rect x="{band_x1:.2f}" y="{band_y1:.2f}" width="{band_x2-band_x1:.2f}" height="{band_y2-band_y1:.2f}" fill="url(#test-hatch)"/>')

          # Model curve.
          pts = []
          samples = 420
          for i in range(samples):
              lf = math.log10(xmin) + i * (math.log10(xmax) - math.log10(xmin)) / (samples - 1)
              f = 10**lf
              pts.append((sx(f), sy(total_asd(f))))
          path = 'M ' + ' L '.join(f'{x:.2f},{y:.2f}' for x, y in pts)
          add(f'<g clip-path="url(#plot-clip)"><path d="{path}" fill="none" stroke="#1218e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>')
          add(f'<line x1="{x0}" y1="{sy(yc):.2f}" x2="{sx(fc):.2f}" y2="{sy(yc):.2f}" stroke="#ff00ff" stroke-width="1.7" stroke-dasharray="8 6"/>')
          add(f'<line x1="{sx(fc):.2f}" y1="{sy(yc):.2f}" x2="{sx(fc):.2f}" y2="{sy(ymin):.2f}" stroke="#ff00ff" stroke-width="1.7" stroke-dasharray="8 6"/>')
          add(f'<circle cx="{sx(fc):.2f}" cy="{sy(yc):.2f}" r="6.5" fill="#ff00ff"/></g>')

          # Axes and ticks.
          add(f'<line class="axis" x1="{x0}" y1="{y0+ph}" x2="{x0+pw}" y2="{y0+ph}"/><line class="axis" x1="{x0}" y1="{y0}" x2="{x0}" y2="{y0+ph}"/>')
          add('<g class="tick">')
          for decade in range(2, 9):
              x = sx(10**decade)
              add(f'<text x="{x:.2f}" y="636" text-anchor="middle">10<tspan baseline-shift="super" font-size="10">{decade}</tspan></text>')
          for decade in (-8, -7, -6):
              y = sy(10**decade)
              exp = str(decade).replace('-', '−')
              add(f'<text x="80" y="{y+5:.2f}" text-anchor="end">10<tspan baseline-shift="super" font-size="10">{exp}</tspan></text>')
          add('</g>')

          # Equation inside the axes, not in a separate UI-style box.
          eq = 'eₙ(f) = √[1.84×10⁻⁹/f¹·⁹ + (2.00×10⁻⁷)²/(1+(f/1.7×10⁵)²) + (2.00×10⁻⁸)²]'
          add(f'<text class="model" x="112" y="86">{html.escape(eq)}</text>')

          # Region labels and equations.
          add('<text class="region" x="255" y="185">1/f Region</text>')
          add('<text class="formula" x="255" y="211">S<tspan baseline-shift="sub" font-size="11">1/f</tspan>(f) = A/f<tspan baseline-shift="super" font-size="11">α</tspan></text>')
          add('<text class="region" x="670" y="300">GR Region</text>')
          add('<text class="formula" x="645" y="326">S<tspan baseline-shift="sub" font-size="11">GR</tspan>(f) = B/[1+(f/f<tspan baseline-shift="sub" font-size="11">c</tspan>)²]</text>')
          add('<text class="region" x="865" y="505">Johnson Region</text>')
          add('<text class="formula" x="882" y="531">e<tspan baseline-shift="sub" font-size="11">J</tspan> = √(4k<tspan baseline-shift="sub" font-size="11">B</tspan>TR)</text>')
          add(f'<text x="{sx(4.2e4):.2f}" y="{sy(7.6e-8):.2f}" font-size="14" fill="#ff00ff">τ<tspan baseline-shift="sub" font-size="11">eff</tspan> = 1/(2πf<tspan baseline-shift="sub" font-size="11">c</tspan>)</text>')
          add(f'<text x="{sx(2.1e5):.2f}" y="{sy(1.02e-7):.2f}" font-size="14">f<tspan baseline-shift="sub" font-size="11">c</tspan> = 1.7 × 10<tspan baseline-shift="super" font-size="11">5</tspan> Hz</text>')

          # Legend and supporting note.
          add('<g transform="translate(895 74)"><rect x="0" y="0" width="151" height="34" rx="4" fill="#fff" stroke="#bfc2c5"/><line x1="13" y1="17" x2="48" y2="17" stroke="#1218e8" stroke-width="4"/><text class="legend" x="58" y="22">Total Noise</text></g>')
          add('<text class="note" x="112" y="596">Note: Parameter values are illustrative and are not intended as rigorous physical constants.</text>')
          add('<text class="axis-label" x="580" y="666" text-anchor="middle">Frequency (Hz)</text>')
          add('<text class="axis-label" transform="rotate(-90 28 336)" x="28" y="336" text-anchor="middle">Noise amplitude spectral density (V/√Hz)</text>')
          add('</svg>')

          Path('assets/images/mct-noise-spectrum.svg').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
      - name: Commit verified changes and remove temporary workflow
        run: |
          rm .github/workflows/refine-mct-noise-figure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/how-to-read-photodetector-noise-spectrum.html assets/images/mct-noise-spectrum.svg .github/workflows/refine-mct-noise-figure.yml
          git commit -m "Refine MCT noise equation and figure"
          git push origin HEAD:agent/final-mct-noise-figure
