name: Phase 1 clean URL migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase1-pretty-urls.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create pretty routes and preserve legacy URLs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ORIGIN = "https://brooks-photonics.com"
          ROUTES = {
              "about.html": "/about/",
              "services.html": "/services/",
              "contact.html": "/contact/",
              "class.html": "/class/",
              "posts.html": "/posts/",
              "utilities.html": "/utilities/",
          }

          def rewrite_main_route_links(text: str) -> str:
              """Point links to Phase 1 pages directly at their canonical pretty routes."""
              for old, pretty in ROUTES.items():
                  stem = re.escape(old)
                  pattern = re.compile(
                      r'(?P<prefix>href\s*=\s*)(?P<q>["\'])(?:\.\./)*' + stem +
                      r'(?P<suffix>[?#][^"\']*)?(?P=q)',
                      re.IGNORECASE,
                  )
                  def repl(match):
                      suffix = match.group('suffix') or ''
                      return f"{match.group('prefix')}{match.group('q')}{pretty}{suffix}{match.group('q')}"
                  text = pattern.sub(repl, text)

              # Homepage links should always use the site root.
              pattern = re.compile(
                  r'(?P<prefix>href\s*=\s*)(?P<q>["\'])(?:\.\./)*index\.html(?P<suffix>[?#][^"\']*)?(?P=q)',
                  re.IGNORECASE,
              )
              def home_repl(match):
                  suffix = match.group('suffix') or ''
                  return f"{match.group('prefix')}{match.group('q')}/{suffix}{match.group('q')}"
              return pattern.sub(home_repl, text)

          def rootify_page_resources(text: str) -> str:
              """A source page moved from /foo.html to /foo/index.html needs root-relative local URLs."""
              attr_re = re.compile(
                  r'(?P<attr>\b(?:href|src|data)\s*=\s*)(?P<q>["\'])(?P<url>[^"\']+)(?P=q)',
                  re.IGNORECASE,
              )

              def repl(match):
                  url = match.group('url')
                  lowered = url.lower()
                  if (
                      url.startswith(('/', '#'))
                      or lowered.startswith(('http://', 'https://', 'mailto:', 'tel:', 'data:', 'javascript:'))
                  ):
                      return match.group(0)
                  return f"{match.group('attr')}{match.group('q')}/{url}{match.group('q')}"

              return attr_re.sub(repl, text)

          def set_canonical(text: str, pretty: str) -> str:
              tag = f'<link rel="canonical" href="{ORIGIN}{pretty}"/>'
              canonical = re.compile(r'<link\b[^>]*\brel\s*=\s*["\']canonical["\'][^>]*>', re.IGNORECASE)
              if canonical.search(text):
                  return canonical.sub(tag, text, count=1)
              if '</title>' in text:
                  return text.replace('</title>', f'</title>\n{tag}', 1)
              return text.replace('</head>', f'{tag}\n</head>', 1)

          def legacy_redirect(pretty: str, label: str) -> str:
              canonical = f"{ORIGIN}{pretty}"
              return f'''<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8"/>
          <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
          <meta name="robots" content="noindex,follow"/>
          <title>Redirecting to {label} - Brooks Photonics</title>
          <link rel="canonical" href="{canonical}"/>
          <meta http-equiv="refresh" content="0; url={pretty}"/>
          <script>
          (function () {{
            var target = '{pretty}' + window.location.search + window.location.hash;
            window.location.replace(target);
          }})();
          </script>
          </head>
          <body>
          <p><a href="{pretty}">Continue to {label}</a></p>
          </body>
          </html>
          '''

          # First update links in every existing HTML document so navigation no longer
          # intentionally sends users through a legacy .html redirect.
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = rewrite_main_route_links(text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          # Create the canonical directory pages from the current Phase 1 source pages.
          labels = {
              'about.html': 'About',
              'services.html': 'Services',
              'contact.html': 'Contact',
              'class.html': 'Classes',
              'posts.html': 'Posts',
              'utilities.html': 'Utilities',
          }

          for old, pretty in ROUTES.items():
              source_path = Path(old)
              source = source_path.read_text(encoding='utf-8')
              source = rewrite_main_route_links(source)
              source = rootify_page_resources(source)
              source = set_canonical(source, pretty)

              # posts.html contains JavaScript URLs in addition to HTML attributes.
              if old == 'posts.html':
                  source = source.replace("fetch('posts/posts.json')", "fetch('/posts/posts.json')")
                  source = source.replace(
                      'titleLink.href = post.file;',
                      "titleLink.href = '/' + String(post.file || '').replace(/^\\/+/, '');",
                  )
                  source = source.replace(
                      'readLink.href = post.file;',
                      "readLink.href = '/' + String(post.file || '').replace(/^\\/+/, '');",
                  )

              destination = Path(pretty.strip('/')) / 'index.html'
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(source, encoding='utf-8')

              # Keep the legacy URL as a compatibility redirect only.
              source_path.write_text(legacy_redirect(pretty, labels[old]), encoding='utf-8')

          # Sitemap should advertise only canonical Phase 1 routes.
          sitemap_path = Path('sitemap.xml')
          sitemap = sitemap_path.read_text(encoding='utf-8')
          for old, pretty in ROUTES.items():
              sitemap = sitemap.replace(f'{ORIGIN}/{old}', f'{ORIGIN}{pretty}')
          sitemap_path.write_text(sitemap, encoding='utf-8')

          # Verification: no normal HTML page should still link to a Phase 1 .html route.
          stale = []
          stale_re = re.compile(
              r'href\s*=\s*["\'](?:\.\./)*(?:about|services|contact|class|posts|utilities)\.html(?:[?#][^"\']*)?["\']',
              re.IGNORECASE,
          )
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if stale_re.search(text):
                  stale.append(str(path))
          if stale:
              raise SystemExit('Stale Phase 1 .html links remain in: ' + ', '.join(stale))

          for old, pretty in ROUTES.items():
              destination = Path(pretty.strip('/')) / 'index.html'
              if not destination.exists():
                  raise SystemExit(f'Missing canonical route file: {destination}')
              text = destination.read_text(encoding='utf-8')
              expected = f'{ORIGIN}{pretty}'
              if f'rel="canonical" href="{expected}"' not in text:
                  raise SystemExit(f'Missing canonical URL in {destination}')

          sitemap = sitemap_path.read_text(encoding='utf-8')
          for old, pretty in ROUTES.items():
              if f'{ORIGIN}/{old}' in sitemap:
                  raise SystemExit(f'Legacy sitemap URL remains: {old}')
              if f'{ORIGIN}{pretty}' not in sitemap:
                  raise SystemExit(f'Canonical sitemap URL missing: {pretty}')

          # The one-time workflow removes itself in the same migration commit.
          Path('.github/workflows/phase1-pretty-urls.yml').unlink()
          PY

          git diff --check
          git status --short

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Migrate primary pages to clean URLs"
          git push origin main
