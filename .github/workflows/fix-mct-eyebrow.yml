name: Fix MCT article eyebrow color

on:
  push:
    branches:
      - fix/mct-eyebrow-white

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mct-eyebrow-white
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply fix
        run: python scripts/fix_mct_eyebrow.py
      - name: Remove one-time files
        run: |
          rm scripts/fix_mct_eyebrow.py
          rm .github/workflows/fix-mct-eyebrow.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make MCT article eyebrow white"
          git push
