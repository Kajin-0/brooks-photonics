name: Apply ENBW editorial polish

on:
  push:
    branches:
      - agent/enbw-final-editorial-polish

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply requested article edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('posts/lock-in-noise-enbw.html')
          html = path.read_text(encoding='utf-8')

          css_old = '.warning-note h3{margin-top:0}'
          css_new = '.warning-note h3{margin-top:0}\n.warning-symbol{display:inline-grid;place-items:center;width:1.35em;height:1.35em;margin-right:.45em;border:1.5px solid var(--purple-dark);border-radius:50%;color:var(--purple-dark);font-weight:700;line-height:1;vertical-align:-.08em}'
          assert css_old in html
          html = html.replace(css_old, css_new, 1)

          note_old = '<div class="note"><p><strong>Reference frequency is not measurement bandwidth.</strong> A lock-in can detect at 1 kHz while its output filter admits only 1.25 Hz of equivalent noise bandwidth.</p></div>'
          note_new = '<div class="warning-note"><p><strong><span class="warning-symbol" aria-hidden="true">!</span>Warning: reference frequency is not measurement bandwidth.</strong> A lock-in can detect at 1 kHz while its output filter admits only 1.25 Hz of equivalent noise bandwidth.</p></div>'
          assert note_old in html
          html = html.replace(note_old, note_new, 1)

          label_old = '<text x="122" y="118" font-size="15" fill="#2c2237">equal-area brick wall</text>'
          label_new = '<text x="205" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#2c2237">ideal brick-wall filter (equal area)</text>'
          assert label_old in html
          html = html.replace(label_old, label_new, 1)

          reporting = '<h2 id="reporting">Minimum reporting information</h2>\n<ul><li>Noise density in V/√Hz or A/√Hz</li><li>Reference or analysis frequency</li><li>Detector temperature, resistance, and bias</li><li>ENBW, time constant, filter order, and filter mode</li><li>Preamplifier gain and input-referred noise</li><li>Dark or illuminated condition</li><li>Acquisition duration and estimator used</li></ul>\n'
          assert reporting in html
          html = html.replace(reporting, '', 1)

          toc_old = '<a href="#workflow">Workflow</a><a href="#reporting">Reporting</a>'
          assert toc_old in html
          html = html.replace(toc_old, '<a href="#workflow">Workflow</a>', 1)

          assert '../assets/images/sr830-front.jpg' in html
          assert '../assets/images/mfli-front.webp' in html
          assert '../assets/images/par124a-front.jpg' in html
          assert 'Minimum reporting information' not in html
          assert 'equal-area brick wall' not in html

          path.write_text(html, encoding='utf-8')
          PY

          rm -f .tmp/enbw-editorial-trigger
          rm -f .github/workflows/enbw-editorial-polish.yml

      - name: Commit editorial polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish ENBW warning and graph"
          git push
