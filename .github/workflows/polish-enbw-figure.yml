name: Polish ENBW figure

on:
  push:
    branches:
      - agent/polish-enbw-figure

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/polish-enbw-figure

      - name: Refine ENBW figure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('posts/lock-in-noise-enbw.html')
          text = path.read_text(encoding='utf-8')

          figure = r'''<figure class="concept-figure"><svg aria-labelledby="equal-area-title equal-area-desc" role="img" viewBox="0 0 760 400" style="font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><title id="equal-area-title">Equivalent noise bandwidth as an equal-area filter</title><desc id="equal-area-desc">The integrated area under the actual filter power response equals the area of an ideal brick-wall filter whose width is the equivalent noise bandwidth.</desc><rect width="760" height="400" fill="#fff"/><text x="380" y="30" text-anchor="middle" font-size="17" font-weight="650" fill="#2c2237">Equivalent noise bandwidth</text><g stroke="#2c2237" stroke-width="1.6" stroke-linecap="round"><line x1="88" y1="320" x2="700" y2="320"/><line x1="88" y1="82" x2="88" y2="320"/></g><path d="M88 99 C152 101 194 122 236 163 C300 224 410 273 694 302 L694 320 L88 320 Z" fill="#6f3ec6" fill-opacity="0.13"/><path d="M88 99 C152 101 194 122 236 163 C300 224 410 273 694 302" fill="none" stroke="#6f3ec6" stroke-width="3.5" stroke-linecap="round"/><path d="M88 320 L88 99 L332 99 L332 320" fill="#6f3ec6" fill-opacity="0.055" stroke="#5b2da8" stroke-width="2.2" stroke-dasharray="8 6"/><line x1="224" y1="82" x2="224" y2="320" stroke="#958a9f" stroke-width="1.5" stroke-dasharray="5 6"/><text x="210" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#2c2237">Equal-area brick-wall filter</text><text x="490" y="247" font-size="13" font-weight="600" fill="#5b2da8">Actual filter |H(f)|²</text><text x="224" y="348" text-anchor="middle" font-size="13" fill="#2c2237">f<tspan baseline-shift="sub" font-size="10">−3 dB</tspan></text><text x="332" y="348" text-anchor="middle" font-size="13" fill="#2c2237">B<tspan baseline-shift="sub" font-size="10">ENBW</tspan></text><text x="394" y="382" text-anchor="middle" font-size="13" font-weight="500" fill="#2c2237">Frequency</text><text transform="rotate(-90 28 201)" x="28" y="201" text-anchor="middle" font-size="13" font-weight="500" fill="#2c2237">Normalized power response</text></svg><figcaption class="figure-caption">ENBW is the width of a unit-height brick-wall filter with the same integrated power response as the actual filter. For a first-order RC low-pass filter, \(B_{\mathrm{ENBW}}=1.571\,f_{-3\,\mathrm{dB}}\).</figcaption></figure>'''

          updated, count = re.subn(
              r'<figure class="concept-figure">.*?</figure>',
              lambda _: figure,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected one concept figure, replaced {count}')

          path.write_text(updated, encoding='utf-8')
          PY

          rm -f .github/workflows/polish-enbw-figure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish ENBW figure typography"
          git push
