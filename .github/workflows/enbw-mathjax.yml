name: Convert ENBW article to MathJax LaTeX

on:
  push:
    branches:
      - agent/enbw-final-editorial-polish

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert article mathematics to TeX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('posts/lock-in-noise-enbw.html')
          html = path.read_text(encoding='utf-8')

          mathjax = r'''<script>
          window.MathJax = {
            tex: {
              inlineMath: [['\\(', '\\)']],
              displayMath: [['\\[', '\\]']],
              processEscapes: true
            },
            options: {
              skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
          };
          </script>
          <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
          '''
          if 'tex-mml-chtml.js' not in html:
              html = html.replace('</head>', mathjax + '</head>', 1)

          html = html.replace(
              '.math-display{margin:30px 0;padding:22px 24px;overflow-x:auto;border:1px solid var(--line);background:#fff;text-align:center}',
              '.math-display,.equation{margin:32px 0;overflow-x:auto;text-align:center}'
          )
          html = html.replace('.math-display math{font-size:1.55rem}\n', '')
          html = html.replace('@media(max-width:900px){.instrument-grid{grid-template-columns:1fr}.math-display math{font-size:1.3rem}}', '@media(max-width:900px){.instrument-grid{grid-template-columns:1fr}}')

          replacements = {
              '<div class="math-display" aria-label="Noise amplitude spectral density equals RMS noise voltage divided by the square root of equivalent noise bandwidth"><math display="block"><msub><mi>e</mi><mi>n</mi></msub><mo>=</mo><mfrac><msub><mi>V</mi><mrow><mi>n</mi><mo>,</mo><mi>rms</mi></mrow></msub><msqrt><mi>ENBW</mi></msqrt></mfrac></math></div>': r'<div class="math-display" aria-label="Noise amplitude spectral density equals RMS noise voltage divided by the square root of equivalent noise bandwidth">\[ e_n = \frac{V_{n,\mathrm{rms}}}{\sqrt{B_{\mathrm{ENBW}}}} \]</div>',
              '<div class="math-display" aria-label="Equivalent noise bandwidth equals the integral of the squared transfer function divided by its zero-frequency value"><math display="block"><mi>ENBW</mi><mo>=</mo><mfrac><mrow><msubsup><mo>∫</mo><mn>0</mn><mo>∞</mo></msubsup><msup><mrow><mo>|</mo><mi>H</mi><mo>(</mo><mi>f</mi><mo>)</mo><mo>|</mo></mrow><mn>2</mn></msup><mi>d</mi><mi>f</mi></mrow><msup><mrow><mo>|</mo><mi>H</mi><mo>(</mo><mn>0</mn><mo>)</mo><mo>|</mo></mrow><mn>2</mn></msup></mfrac></math></div>': r'<div class="math-display" aria-label="Equivalent noise bandwidth equals the integral of the squared transfer function divided by its zero-frequency value">\[ B_{\mathrm{ENBW}} = \frac{\displaystyle\int_{0}^{\infty}\lvert H(f)\rvert^2\,df}{\lvert H(0)\rvert^2} \]</div>',
              '<code>V<sub>n,rms</sub></code>': r'\(V_{n,\mathrm{rms}}\)',
              '<code>|H(f)|²</code>': r'\(\lvert H(f)\rvert^2\)',
              '<div class="equation">ENBW = 1/(8T) = 1.25 Hz</div>': r'<div class="equation">\[ B_{\mathrm{ENBW}} = \frac{1}{8T} = 1.25\,\mathrm{Hz} \]</div>',
              '<div class="equation">e<sub>n</sub> = 12.0/√1.25 = 10.7 nV/√Hz</div>': r'<div class="equation">\[ e_n = \frac{12.0\,\mathrm{nV}}{\sqrt{1.25\,\mathrm{Hz}}} = 10.7\,\frac{\mathrm{nV}}{\sqrt{\mathrm{Hz}}} \]</div>',
              '<code>R = √(X² + Y²)</code>': r'\(R=\sqrt{X^2+Y^2}\)',
              '<code>ENBW × record duration ≥ 100</code>': r'\(B_{\mathrm{ENBW}}T_{\mathrm{record}}\ge 100\)',
              'For a first-order RC low-pass filter, ENBW = 1.571 f<sub>−3dB</sub>.': r'For a first-order RC low-pass filter, \(B_{\mathrm{ENBW}}=1.571\,f_{-3\,\mathrm{dB}}\).',
              '10–30 nV/√Hz': r'\(10\text{–}30\,\mathrm{nV}/\sqrt{\mathrm{Hz}}\)',
              '10 nV/√Hz': r'\(10\,\mathrm{nV}/\sqrt{\mathrm{Hz}}\)',
              '6 nV/√Hz': r'\(6\,\mathrm{nV}/\sqrt{\mathrm{Hz}}\)',
              '11.7 nV/√Hz': r'\(11.7\,\mathrm{nV}/\sqrt{\mathrm{Hz}}\)',
              '30 nV/√Hz': r'\(30\,\mathrm{nV}/\sqrt{\mathrm{Hz}}\)',
              '30.6 nV/√Hz': r'\(30.6\,\mathrm{nV}/\sqrt{\mathrm{Hz}}\)',
              '<strong>Volts/√Hz</strong>': r'<strong>\(\mathrm{V}/\sqrt{\mathrm{Hz}}\)</strong>',
              '<strong>Do not divide the displayed X Noise or Y Noise value by √ENBW again.</strong>': r'<strong>Do not divide the displayed X Noise or Y Noise value by \(\sqrt{B_{\mathrm{ENBW}}}\) again.</strong>',
              'reported in V/√Hz': r'reported in \(\mathrm{V}/\sqrt{\mathrm{Hz}}\)',
              'by √ENBW a second time': r'by \(\sqrt{B_{\mathrm{ENBW}}}\) a second time',
              '−3 dB bandwidth': r'\(-3\,\mathrm{dB}\) bandwidth',
              '−3 dB point': r'\(-3\,\mathrm{dB}\) point',
              'ENBW/f<sub>−3dB</sub>': r'\(B_{\mathrm{ENBW}}/f_{-3\,\mathrm{dB}}\)',
              'f<sub>−3dB</sub>': r'\(f_{-3\,\mathrm{dB}}\)',
              '<th>ENBW</th>': r'<th>\(B_{\mathrm{ENBW}}\)</th>',
              '<th>SR830 ENBW</th>': r'<th>SR830 \(B_{\mathrm{ENBW}}\)</th>',
          }
          for old, new in replacements.items():
              html = html.replace(old, new)

          for value in ['0.1592/T','0.2500/T','0.1024/T','0.1250/T','0.0811/T','0.09375/T','0.0692/T','0.078125/T','0.0614/T','0.06836/T','0.0557/T','0.06151/T','0.0513/T','0.05636/T','0.0479/T','0.05238/T','1.5708','1.2203','1.1554','1.1285','1.1138','1.1046','1.0983','1.0937']:
              html = html.replace(f'<td>{value}</td>', f'<td>\\({value}\\)</td>')

          html = html.replace('<li>Reference frequency: 1 kHz</li>', r'<li>Reference frequency: \(1\,\mathrm{kHz}\)</li>')
          html = html.replace('<li>Time constant: 100 ms</li>', r'<li>Time constant: \(T=100\,\mathrm{ms}\)</li>')
          html = html.replace('<li>Measured X standard deviation: 12.0 nV RMS</li>', r'<li>Measured \(X\) standard deviation: \(12.0\,\mathrm{nV}_{\mathrm{rms}}\)</li>')
          html = html.replace('The 1 kHz reference and 1.25 Hz ENBW describe different parts of the measurement.', r'The \(1\,\mathrm{kHz}\) reference and \(1.25\,\mathrm{Hz}\) equivalent noise bandwidth describe different parts of the measurement.')
          html = html.replace('A lock-in can detect at 1 kHz while its output filter admits only 1.25 Hz of equivalent noise bandwidth.', r'A lock-in can detect at \(1\,\mathrm{kHz}\) while its output filter admits only \(1.25\,\mathrm{Hz}\) of equivalent noise bandwidth.')
          html = html.replace('settled X or Y time series', r'settled \(X\) or \(Y\) time series')
          html = html.replace('Acquire X or Y versus time', r'Acquire \(X\) or \(Y\) versus time')
          html = html.replace('Divide by √ENBW only when starting from a filtered RMS fluctuation.', r'Divide by \(\sqrt{B_{\mathrm{ENBW}}}\) only when starting from a filtered RMS fluctuation.')

          assert '<math ' not in html
          assert '<msub>' not in html
          assert 'tex-mml-chtml.js' in html
          assert '.math-display,.equation{margin:32px 0;overflow-x:auto;text-align:center}' in html
          assert '../assets/images/sr830-front.jpg' in html
          assert '../assets/images/mfli-front.webp' in html
          assert '../assets/images/par124a-front.jpg' in html

          path.write_text(html, encoding='utf-8')
          PY

          rm -f .tmp/enbw-mathjax-trigger .tmp/enbw-mathjax-trigger-2
          rm -f .tmp/tree-test-note .tmp/tree-test-note-2
          rm -f .github/workflows/enbw-mathjax.yml

      - name: Commit LaTeX conversion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use MathJax LaTeX throughout ENBW article"
          git push
