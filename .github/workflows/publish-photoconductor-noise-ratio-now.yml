name: Publish two-frequency noise-ratio article now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-photoconductor-noise-ratio-now.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish article
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          date = "2026-08-02"
          label = "August 2, 2026"
          article_path = Path("posts/photoconductor-noise-ratio.html")
          article = article_path.read_text(encoding="utf-8")

          def once(text, old, new, name):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one {name}; found {count}")
              return text.replace(old, new, 1)

          article = once(article,
              '<meta name="robots" content="noindex,nofollow,noarchive"/>',
              '<meta name="robots" content="index,follow,max-image-preview:large"/>',
              "draft robots directive")
          article = once(article,
              '.draft-note{margin:0;padding:10px 18px;border-bottom:1px solid #ddd6e3;background:#faf8fc;color:#55475f;text-align:center;font-size:13px}\n',
              '', "draft-note CSS")
          article = once(article,
              '<p class="draft-note"><strong>Unpublished preview:</strong> available by direct URL only; not listed in the technical-post library.</p>\n',
              '', "preview banner")
          article = once(article,
              '<span>Updated July 30, 2026</span><span>Draft preview</span><span>9-minute read</span>',
              f'<span>Published {label}</span><span>9-minute read</span>',
              "visible draft metadata")
          article = once(article,
              '  "dateModified": "2026-07-30",',
              f'  "datePublished": "{date}",\n  "dateModified": "{date}",',
              "structured dates")

          canonical = '<link rel="canonical" href="https://brooks-photonics.com/posts/photoconductor-noise-ratio.html"/>\n'
          social = canonical + f'''<meta property="og:type" content="article"/>
<meta property="og:site_name" content="Brooks Photonics"/>
<meta property="og:title" content="What a Two-Frequency Noise Ratio Can Reveal About a Photoconductor"/>
<meta property="og:description" content="A practical, model-light method for comparing low-frequency excess noise in photoconductors using a lower test frequency and a higher flat-band reference."/>
<meta property="og:url" content="https://brooks-photonics.com/posts/photoconductor-noise-ratio.html"/>
<meta property="article:section" content="Noise and bandwidth"/>
<meta property="article:published_time" content="{date}"/>
<meta property="article:modified_time" content="{date}"/>
<meta name="twitter:card" content="summary"/>
<meta name="twitter:title" content="What a Two-Frequency Noise Ratio Can Reveal About a Photoconductor"/>
<meta name="twitter:description" content="A two-frequency method for exposing low-frequency excess noise without assuming an ideal 1/f spectrum."/>
'''
          article = once(article, canonical, social, "canonical link")
          article_path.write_text(article, encoding="utf-8")

          posts_path = Path("posts/posts.json")
          data = json.loads(posts_path.read_text(encoding="utf-8"))
          item = {
              "subject": "Noise and bandwidth",
              "title": "What a Two-Frequency Noise Ratio Can Reveal About a Photoconductor",
              "file": "posts/photoconductor-noise-ratio.html",
              "date": date,
              "reading_time": "9-minute read",
              "summary": "A practical, model-light method for comparing low-frequency excess noise using a lower test frequency and a higher flat-band reference without assuming an ideal 1/f spectrum."
          }
          posts = [p for p in data["posts"] if p.get("file") != item["file"]]
          posts.append(item)
          data["posts"] = sorted(posts, key=lambda p: p.get("date", ""), reverse=True)
          posts_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          index_path = Path("posts.html")
          index = index_path.read_text(encoding="utf-8")
          if 'href="posts/photoconductor-noise-ratio.html"' not in index:
              card = f'''<article class="post-card">
<p class="post-card__meta"><time datetime="{date}">{label}</time><span>9-minute read</span></p>
<h3><a href="posts/photoconductor-noise-ratio.html">What a Two-Frequency Noise Ratio Can Reveal About a Photoconductor</a></h3>
<p>A practical, model-light method for comparing low-frequency excess noise using a lower test frequency and a higher flat-band reference without assuming an ideal 1/f spectrum.</p>
<a class="post-card__link" href="posts/photoconductor-noise-ratio.html">Read article</a>
</article>
'''
              index = once(index, '<div class="post-grid">\n', '<div class="post-grid">\n' + card, "post grid")
          index_path.write_text(index, encoding="utf-8")

          sitemap_path = Path("sitemap.xml")
          sitemap = sitemap_path.read_text(encoding="utf-8")
          sitemap = sitemap.replace(
              '<url><loc>https://brooks-photonics.com/posts.html</loc><lastmod>2026-07-30</lastmod></url>',
              f'<url><loc>https://brooks-photonics.com/posts.html</loc><lastmod>{date}</lastmod></url>')
          if 'posts/photoconductor-noise-ratio.html' not in sitemap:
              entry = f'  <url><loc>https://brooks-photonics.com/posts/photoconductor-noise-ratio.html</loc><lastmod>{date}</lastmod></url>\n'
              marker = '  <url><loc>https://brooks-photonics.com/posts/how-to-read-photodetector-noise-spectrum.html</loc>'
              if marker not in sitemap:
                  raise SystemExit("Sitemap insertion point missing")
              sitemap = sitemap.replace(marker, entry + marker, 1)
          sitemap_path.write_text(sitemap, encoding="utf-8")

          json.loads(posts_path.read_text(encoding="utf-8"))
          ET.parse(sitemap_path)
          PY

      - name: Validate and commit
        run: |
          set -euo pipefail
          article=posts/photoconductor-noise-ratio.html
          grep -q 'index,follow,max-image-preview:large' "$article"
          grep -q '"datePublished": "2026-08-02"' "$article"
          grep -q 'Published August 2, 2026' "$article"
          ! grep -q 'Unpublished preview\|Draft preview\|noindex,nofollow' "$article"
          test "$(grep -o 'posts/photoconductor-noise-ratio.html' posts/posts.json | wc -l)" -eq 1
          test "$(grep -o 'posts/photoconductor-noise-ratio.html' posts.html | wc -l)" -eq 2
          test "$(grep -o 'posts/photoconductor-noise-ratio.html' sitemap.xml | wc -l)" -eq 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-photoconductor-noise-ratio-now.yml
          git add posts/photoconductor-noise-ratio.html posts/posts.json posts.html sitemap.xml
          git commit -m "Publish two-frequency photoconductor noise article"
          git push origin HEAD:main
