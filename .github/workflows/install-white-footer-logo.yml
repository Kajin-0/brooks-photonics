name: Install white footer logo

on:
  push:
    branches:
      - design/white-footer-logo

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/white-footer-logo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Create the transparent white logo and update footers
        run: python scripts/install_white_footer_logo.py
      - name: Remove one-time installation files
        run: |
          rm scripts/install_white_footer_logo.py
          rm .github/workflows/install-white-footer-logo.yml
      - name: Commit footer design update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use white Brooks Photonics logo in site footers"
          git push
