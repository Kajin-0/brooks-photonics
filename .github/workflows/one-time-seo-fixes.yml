name: Apply small SEO fixes

on:
  push:
    branches:
      - agent/seo-small-fixes

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seo-small-fixes
          fetch-depth: 0

      - name: Apply targeted updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          DATE = "2026-07-30"
          LINKEDIN = "https://www.linkedin.com/in/brooks-photonics/"
          FAVICON = (
              '<link href="/assets/images/Brooks_Photonics_Logo.png" rel="icon" sizes="96x96" type="image/png"/>\n'
              '<link href="/assets/images/Brooks_Photonics_Logo.png" rel="apple-touch-icon"/>\n'
          )
          EMAIL_LINK = '<a href="mailto:terence@brooks-photonics.com">terence@brooks-photonics.com</a>'
          LINKEDIN_LINK = (
              '<a href="https://www.linkedin.com/in/brooks-photonics/" '
              'rel="me noopener noreferrer" target="_blank">LinkedIn</a>'
          )

          def write(path: Path, text: str) -> None:
              path.write_text(text, encoding="utf-8")

          def add_favicon(text: str) -> str:
              if 'rel="icon"' in text:
                  return text
              return re.sub(r'(<title>.*?</title>\s*)', r'\1' + FAVICON, text, count=1, flags=re.S)

          def add_linkedin(text: str) -> str:
              if LINKEDIN in text:
                  return text
              return text.replace(EMAIL_LINK, EMAIL_LINK + LINKEDIN_LINK, 1)

          def set_meta_author(text: str) -> str:
              if re.search(r'<meta\s+name="author"', text):
                  return re.sub(
                      r'<meta\s+name="author"\s+content="[^"]*"\s*/>',
                      '<meta name="author" content="Brooks Photonics"/>',
                      text,
                      count=1,
                  )
              lines = text.splitlines(keepends=True)
              for i, line in enumerate(lines):
                  if 'name="description"' in line:
                      lines.insert(i + 1, '<meta name="author" content="Brooks Photonics"/>\n')
                      return ''.join(lines)
              return text

          def update_jsonld_articles(text: str) -> str:
              pattern = re.compile(
                  r'<script type="application/ld\+json">\s*(.*?)\s*</script>',
                  re.S,
              )

              def replace(match: re.Match[str]) -> str:
                  data = json.loads(match.group(1))
                  article_types = {"Article", "TechArticle", "NewsArticle", "BlogPosting"}
                  if data.get("@type") in article_types:
                      data["author"] = {
                          "@type": "Organization",
                          "name": "Brooks Photonics",
                          "url": "https://brooks-photonics.com/",
                      }
                      data["dateModified"] = DATE
                  return '<script type="application/ld+json">\n' + json.dumps(
                      data, indent=2, ensure_ascii=False
                  ) + '\n</script>'

              return pattern.sub(replace, text)

          def update_modified_meta(text: str) -> str:
              if 'property="article:modified_time"' in text:
                  return re.sub(
                      r'(<meta property="article:modified_time" content=")[^"]+("/>)',
                      rf'\g<1>{DATE}\g<2>',
                      text,
                      count=1,
                  )
              return re.sub(
                  r'(<meta property="article:published_time"[^>]+/>\s*)',
                  r'\1<meta property="article:modified_time" content="' + DATE + r'"/>\n',
                  text,
                  count=1,
              )

          top_level = [
              "index.html", "about.html", "services.html", "class.html",
              "utilities.html", "posts.html", "contact.html", "thanks.html",
              "class-confirmation.html",
          ]
          for name in top_level:
              path = Path(name)
              if path.exists():
                  text = path.read_text(encoding="utf-8")
                  write(path, add_linkedin(add_favicon(text)))

          index_path = Path("index.html")
          index_text = index_path.read_text(encoding="utf-8")
          jsonld_pattern = re.compile(
              r'<script type="application/ld\+json">\s*(.*?)\s*</script>', re.S
          )
          match = jsonld_pattern.search(index_text)
          if not match:
              raise RuntimeError("Homepage Organization JSON-LD was not found")
          organization = json.loads(match.group(1))
          graph = {
              "@context": "https://schema.org",
              "@graph": [
                  organization,
                  {
                      "@type": "WebSite",
                      "name": "Brooks Photonics",
                      "url": "https://brooks-photonics.com/",
                  },
              ],
          }
          index_text = index_text[:match.start()] + (
              '<script type="application/ld+json">\n'
              + json.dumps(graph, indent=2, ensure_ascii=False)
              + '\n</script>'
          ) + index_text[match.end():]
          write(index_path, index_text)

          posts_path = Path("posts.html")
          posts_text = posts_path.read_text(encoding="utf-8")
          posts_text = posts_text.replace(
              '<p class="post-card__meta"><time datetime="2026-07-29">July 29, 2026</time><span>10-minute read</span></p>',
              '<p class="post-card__meta"><time datetime="2026-07-28">July 28, 2026</time><span>10-minute read</span></p>',
              1,
          )
          write(posts_path, posts_text)

          for path in sorted(Path("posts").glob("*.html")):
              text = path.read_text(encoding="utf-8")
              text = add_favicon(text)
              text = add_linkedin(text)
              text = set_meta_author(text)
              text = update_jsonld_articles(text)
              text = update_modified_meta(text)
              write(path, text)

          mct_path = Path("posts/how-to-read-photodetector-noise-spectrum.html")
          mct_text = mct_path.read_text(encoding="utf-8")
          old_cta = '<a class="button button-light" href="lock-in-noise-enbw.html">Read the ENBW reference</a></section>'
          new_cta = old_cta.replace(
              '</section>',
              '<p><a class="text-link" href="../contact.html">Discuss a dataset</a></p></section>',
          )
          if old_cta in mct_text and 'Discuss a dataset</a></p></section>' not in mct_text:
              mct_text = mct_text.replace(old_cta, new_cta, 1)
          write(mct_path, mct_text)

          page_404 = '''<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8"/>
          <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
          <meta name="robots" content="noindex,follow"/>
          <title>Page Not Found | Brooks Photonics</title>
          <link href="/assets/images/Brooks_Photonics_Logo.png" rel="icon" sizes="96x96" type="image/png"/>
          <link href="/assets/images/Brooks_Photonics_Logo.png" rel="apple-touch-icon"/>
          <link href="/assets/css/style.css" rel="stylesheet"/>
          <link href="/assets/css/refinement.css" rel="stylesheet"/>
          <link href="/assets/css/motion.css" rel="stylesheet"/>
          </head>
          <body>
          <a class="skip-link" href="#main-content">Skip to main content</a>
          <header class="site-header"><div class="container header-inner"><a aria-label="Brooks Photonics home" class="brand" href="/index.html"><img alt="" class="logo" height="48" src="/assets/images/Brooks_Photonics_Logo.png" width="48"/><span class="brand-copy"><strong>Brooks Photonics</strong><span>Infrared detector analysis</span></span></a><nav aria-label="Primary navigation" class="desktop-nav"><a href="/index.html">Home</a><a href="/services.html">Services</a><a href="/posts.html">Posts</a><a class="nav-cta" href="/contact.html">Start a project</a></nav></div></header>
          <main id="main-content"><section class="page-hero page-hero-compact"><div class="container page-hero-inner"><p class="eyebrow">404</p><h1>Page not found.</h1><p>The requested page does not exist or has moved.</p><div class="button-row"><a class="button button-light" href="/index.html">Home</a><a class="button button-ghost" href="/posts.html">Technical articles</a></div></div></section></main>
          <footer class="site-footer"><div class="container footer-grid"><div class="footer-brand"><a aria-label="Brooks Photonics home" class="brand brand-footer" href="/index.html"><img alt="" class="logo" height="48" src="/assets/images/Brooks_Photonics_Logo.png" width="48"/><span class="brand-copy"><strong>Brooks Photonics</strong><span>Infrared detector analysis</span></span></a><p>Technical review of infrared detector electrical, spectral, and noise data.</p></div><div class="footer-links"><h2>Explore</h2><a href="/services.html">Services</a><a href="/utilities.html">Utilities</a><a href="/posts.html">Technical posts</a></div><div class="footer-contact"><h2>Contact</h2><a href="mailto:terence@brooks-photonics.com">terence@brooks-photonics.com</a><a href="https://www.linkedin.com/in/brooks-photonics/" rel="me noopener noreferrer" target="_blank">LinkedIn</a></div></div><div class="container footer-bottom"><span>© 2026 Brooks Photonics. All rights reserved.</span><a href="/contact.html">Discuss a project</a></div></footer>
          </body>
          </html>
          '''
          page_404 = '\n'.join(line.strip() for line in page_404.splitlines() if line.strip()) + '\n'
          write(Path("404.html"), page_404)

          sitemap_path = Path("sitemap.xml")
          sitemap = sitemap_path.read_text(encoding="utf-8")
          sitemap = sitemap.replace(
              '<url><loc>https://brooks-photonics.com/</loc></url>',
              f'<url><loc>https://brooks-photonics.com/</loc><lastmod>{DATE}</lastmod></url>',
          )
          for url in (
              "https://brooks-photonics.com/posts.html",
              "https://brooks-photonics.com/posts/how-to-read-photodetector-noise-spectrum.html",
              "https://brooks-photonics.com/posts/lock-in-noise-enbw.html",
          ):
              sitemap = re.sub(
                  rf'(<url><loc>{re.escape(url)}</loc><lastmod>)[^<]+(</lastmod></url>)',
                  rf'\g<1>{DATE}\g<2>',
                  sitemap,
              )
          write(sitemap_path, sitemap)

          for path in [Path("index.html"), *sorted(Path("posts").glob("*.html"))]:
              text = path.read_text(encoding="utf-8")
              for block in re.findall(
                  r'<script type="application/ld\+json">\s*(.*?)\s*</script>', text, re.S
              ):
                  json.loads(block)

          Path(".github/workflows/one-time-seo-fixes.yml").unlink()
          PY

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply small SEO and site consistency fixes"
          git push origin HEAD:agent/seo-small-fixes
