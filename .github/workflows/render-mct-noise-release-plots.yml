name: Render MCT noise release assets

on:
  push:
    branches:
      - release/mct-noise-post

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/mct-noise-post
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pillow
      - run: python scripts/generate_standalone_noise_component_plots.py
      - run: python scripts/generate_mct_noise_social_preview.py
      - name: Commit regenerated assets
        run: |
          FILES="assets/images/mct-noise-standalone-1f.svg assets/images/mct-noise-standalone-gr.svg assets/images/mct-noise-standalone-johnson.svg assets/images/mct-noise-social-preview.png"
          if git diff --quiet -- $FILES; then
            echo "Assets already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Regenerate MCT noise release assets"
          git push
