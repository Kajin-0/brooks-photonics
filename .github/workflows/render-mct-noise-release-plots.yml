name: Render MCT noise release plots

on:
  push:
    branches:
      - release/mct-noise-post

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/mct-noise-post
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python scripts/generate_standalone_noise_component_plots.py
      - name: Commit regenerated plots
        run: |
          if git diff --quiet -- assets/images/mct-noise-standalone-1f.svg assets/images/mct-noise-standalone-gr.svg assets/images/mct-noise-standalone-johnson.svg; then
            echo "Plots already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/mct-noise-standalone-1f.svg assets/images/mct-noise-standalone-gr.svg assets/images/mct-noise-standalone-johnson.svg
          git commit -m "Regenerate publication-ready noise plots"
          git push
