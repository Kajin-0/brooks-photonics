name: Apply case-study commercial clarity copy

on:
  push:
    branches:
      - agent/clarify-case-study-offer
    paths:
      - .github/workflows/apply-case-study-commercial-copy.yml

permissions:
  contents: write

jobs:
  apply-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clarify-case-study-offer
          fetch-depth: 0

      - name: Apply explicit example-deliverable copy
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("services.html"): [
                  (
                      '<p class="eyebrow eyebrow-dark">Public-data case study</p>',
                      '<p class="eyebrow eyebrow-dark">Example technical review - public data</p>',
                  ),
                  (
                      '<p class="case-feature-lead">Read-level analysis of public WFC3/IR HgCdTe data showed that the strongest spatial anomaly disappeared before the detector-wide transient ended. Excluding the affected portion of the ramp materially changed the reconstructed count-rate product.</p>',
                      '<p class="case-feature-lead"><strong>This demonstration shows the type of analysis, engineering interpretation, and technical report available through a Brooks Photonics detector-review engagement.</strong> Read-level analysis of public WFC3/IR HgCdTe data showed that the strongest spatial anomaly disappeared before the detector-wide transient ended. Excluding the affected portion of the ramp materially changed the reconstructed count-rate product.</p>',
                  ),
                  (
                      '<p class="case-feature-note">Demonstration using public HST measurements from MAST. No client data are represented.</p>',
                      '<p class="case-feature-note">Example deliverable created from public HST measurements in MAST. Client engagements apply the same structured review process to customer-provided detector data.</p>',
                  ),
                  (
                      '        <a class="button button-primary" href="case-study-wfc3-ir-ramp.html">View the case study</a>\n        <a class="button button-secondary" href="assets/docs/case-studies/Brooks_Photonics_Case_001.pdf" rel="noopener" target="_blank">Download client report</a>\n      </div>',
                      '        <a class="button button-primary" href="case-study-wfc3-ir-ramp.html">View the example report</a>\n        <a class="button button-secondary" href="contact.html">Request a similar review</a>\n      </div>\n      <p class="case-feature-report-link"><a class="text-link" href="assets/docs/case-studies/Brooks_Photonics_Case_001.pdf" rel="noopener" target="_blank">Download the six-page example PDF</a></p>',
                  ),
              ],
              Path("case-study-wfc3-ir-ramp.html"): [
                  (
                      '<meta name="description" content="A public-data WFC3/IR HgCdTe case study showing how read-level spatial, temporal, control-relative, and independent reconstruction tests separated a time-variable background from detector-intrinsic behavior."/>',
                      '<meta name="description" content="An example Brooks Photonics detector-review deliverable using public WFC3/IR HgCdTe data to separate a time-variable background from detector-intrinsic behavior."/>',
                  ),
                  (
                      '<meta property="og:description" content="Read-level analysis showed that the spatial anomaly disappeared before the detector-wide transient ended, materially changing the reconstructed count-rate product."/>',
                      '<meta property="og:description" content="Example detector-review deliverable: read-level analysis separated a time-variable background from detector-intrinsic behavior and changed the reconstructed count-rate product."/>',
                  ),
                  (
                      '  "description": "Read-level spatial, temporal, control-relative, and independent reconstruction analysis of public HST WFC3/IR HgCdTe data.",',
                      '  "description": "Example detector-review deliverable using read-level spatial, temporal, control-relative, and independent reconstruction analysis of public HST WFC3/IR HgCdTe data.",',
                  ),
                  (
                      '<p class="eyebrow">Public-data case study 001</p>',
                      '<p class="eyebrow">Example technical review - public data</p>',
                  ),
                  (
                      '<p class="case-hero-lead">Why spatial inspection alone would accept affected reads - and bias the final count-rate product.</p>',
                      '<p class="case-hero-lead">Why spatial inspection alone would accept affected reads - and bias the final count-rate product.</p>\n      <p class="case-example-notice"><strong>This is an example deliverable.</strong> Brooks Photonics provides comparable independent analysis for client-supplied detector measurements, tailored to the device, available data, and engineering decision.</p>',
                  ),
                  (
                      '<div class="container cta-panel"><div><p class="eyebrow">Apply the same discipline to your data</p><h2>Bring the measurement, the suspected mechanism, and the decision that depends on it.</h2></div><a class="button button-light" href="contact.html">Discuss a detector review</a></div>',
                      '<div class="container cta-panel"><div><p class="eyebrow">Request a similar technical review</p><h2>Have detector data with an unresolved performance limitation? Apply the same evidence-based analysis structure to your measurements.</h2></div><a class="button button-light" href="contact.html">Request a detector review</a></div>',
                  ),
              ],
              Path("assets/css/case-study.css"): [
                  (
                      '.case-feature-note {\n  margin: 0;\n  color: #756e7c;\n  font-size: 12px;\n}\n',
                      '.case-feature-note {\n  margin: 0;\n  color: #756e7c;\n  font-size: 12px;\n}\n\n.case-feature-report-link {\n  margin: 14px 0 0;\n}\n\n.case-example-notice {\n  max-width: 720px;\n  margin: 24px 0 0;\n  padding: 16px 18px;\n  color: rgba(255, 255, 255, .84);\n  border-left: 3px solid #d39a3b;\n  background: rgba(255, 255, 255, .075);\n  font-size: 14px;\n  line-height: 1.55;\n}\n\n.case-example-notice strong {\n  color: #fff;\n}\n',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"Expected one match in {path} but found {count}: {old[:80]!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Validate commercial clarity and markup
        run: |
          python - <<'PY'
          import json
          import re
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          for name in ("services.html", "case-study-wfc3-ir-ramp.html"):
              Parser().feed(Path(name).read_text(encoding="utf-8"))

          services = Path("services.html").read_text(encoding="utf-8")
          case = Path("case-study-wfc3-ir-ramp.html").read_text(encoding="utf-8")
          css = Path("assets/css/case-study.css").read_text(encoding="utf-8")

          required = [
              (services, "Example technical review - public data"),
              (services, "available through a Brooks Photonics detector-review engagement"),
              (services, "Request a similar review"),
              (services, "Download the six-page example PDF"),
              (case, "This is an example deliverable."),
              (case, "provides comparable independent analysis for client-supplied detector measurements"),
              (case, "Request a similar technical review"),
              (case, "Request a detector review"),
              (css, ".case-example-notice"),
          ]
          for text, phrase in required:
              if phrase not in text:
                  raise SystemExit(f"Missing required phrase: {phrase}")

          match = re.search(r'<script type="application/ld\+json">\s*(.*?)\s*</script>', case, re.S)
          if not match:
              raise SystemExit("JSON-LD block not found")
          json.loads(match.group(1))
          PY

      - name: Commit copy refinements and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-case-study-commercial-copy.yml
          git add services.html case-study-wfc3-ir-ramp.html assets/css/case-study.css
          git commit -m "Clarify Case Study 001 as an example deliverable"
          git push origin HEAD:agent/clarify-case-study-offer
