name: Fix PAR124A image

on:
  push:
    branches:
      - agent/enbw-direct-images-final

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace PAR124A image only
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://www.perfectcircuit.com/media/wysiwyg/articles/joranalogue-collide4-interview/lockin.jpg" -o assets/images/par124a-front.jpg
          file assets/images/par124a-front.jpg | grep -q 'JPEG image data'
          test -s assets/images/par124a-front.jpg

          python3 - <<'PY'
          from pathlib import Path

          page = Path('posts/lock-in-noise-enbw.html')
          html = page.read_text(encoding='utf-8')
          old = '../assets/images/par124a-front.webp'
          new = '../assets/images/par124a-front.jpg'
          assert old in html
          page.write_text(html.replace(old, new), encoding='utf-8')
          PY

          rm -f assets/images/par124a-front.webp
          rm -rf .tmp/enbw-par
          rm -f .github/workflows/fix-par124a.yml

      - name: Commit PAR124A repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace corrupted PAR124A image"
          git push
