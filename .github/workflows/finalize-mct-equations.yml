name: Finalize MCT spectrum equations

on:
  push:
    branches:
      - agent/finalize-mct-equations-positioning
    paths:
      - .github/finalize-mct-equations.trigger

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finalize-mct-equations-positioning
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy matplotlib
      - name: Render final MCT spectrum
        run: |
          python - <<'PY'
          import numpy as np
          import matplotlib as mpl
          import matplotlib.pyplot as plt
          from matplotlib.ticker import LogLocator, LogFormatterMathtext
          from pathlib import Path

          mpl.rcParams.update({
              "font.family": "DejaVu Sans",
              "mathtext.fontset": "stix",
              "svg.fonttype": "path",
          })

          f = np.logspace(2, 8, 1600)
          S_1f = 1.84e-9 / f**1.9
          S_gr = (2.00e-7)**2 / (1 + (f/1.7e5)**2)
          S_j = (2.00e-8)**2
          e_total = np.sqrt(S_1f + S_gr + S_j)

          fc = 1.7e5
          yfc = np.sqrt(1.84e-9/fc**1.9 + (2.00e-7)**2/2 + S_j)

          fig, ax = plt.subplots(figsize=(12, 7.2), dpi=180)
          ax.set_xscale("log")
          ax.set_yscale("log")
          ax.set_xlim(1e2, 1e8)
          ax.set_ylim(1e-8, 1e-6)

          ax.xaxis.set_major_locator(LogLocator(base=10, numticks=8))
          ax.xaxis.set_minor_locator(LogLocator(base=10, subs=np.arange(2,10)*0.1, numticks=100))
          ax.yaxis.set_major_locator(LogLocator(base=10, numticks=4))
          ax.yaxis.set_minor_locator(LogLocator(base=10, subs=np.arange(2,10)*0.1, numticks=100))
          ax.xaxis.set_major_formatter(LogFormatterMathtext())
          ax.yaxis.set_major_formatter(LogFormatterMathtext())
          ax.grid(which="major", linestyle="--", linewidth=0.85, alpha=0.52)
          ax.grid(which="minor", linestyle="--", linewidth=0.52, alpha=0.30)

          band = (f >= 1e3) & (f <= 1e4)
          ax.fill_between(
              f[band], 1e-8, e_total[band],
              facecolor="#8ed08f", alpha=0.34,
              hatch="//", edgecolor="#5aaa61", linewidth=0.0, zorder=1
          )

          ax.plot(f, e_total, color="#1a32d8", lw=2.8, label="Total Noise", zorder=4)
          ax.plot([1e2, fc], [yfc, yfc], color="#ff00ff", ls=(0,(5,4)), lw=1.5, zorder=2)
          ax.plot([fc, fc], [1e-8, yfc], color="#ff00ff", ls=(0,(5,4)), lw=1.5, zorder=2)
          ax.scatter([fc], [yfc], s=56, color="#ff00ff", zorder=5)

          ax.set_title("Photodetector Noise Model", fontsize=16, fontweight="semibold", pad=16)
          ax.set_xlabel("Frequency (Hz)", fontsize=11.5, labelpad=9)
          ax.set_ylabel(r"Noise amplitude spectral density (V/$\sqrt{\mathrm{Hz}}$)", fontsize=11.5, labelpad=8)

          model = (
              r"$e_n(f)=\left[\frac{1.84\times10^{-9}}{f^{1.9}}"
              r"+\frac{(2.00\times10^{-7})^2}{1+(f/1.7\times10^5)^2}"
              r"+(2.00\times10^{-8})^2\right]^{1/2}$"
          )
          ax.text(1.28e2, 8.55e-7, model, fontsize=11.0, ha="left", va="top",
                  bbox=dict(facecolor="white", edgecolor="none", alpha=0.88, pad=2.0))

          ax.text(7.0e2, 3.55e-7, "1/f Region", fontsize=14, fontweight="bold", ha="left")
          ax.text(7.0e2, 2.72e-7, r"$S_{1/f}(f)=A/f^\alpha$", fontsize=12.5, ha="left",
                  bbox=dict(facecolor="white", edgecolor="none", alpha=0.82, pad=1.5))

          ax.text(4.2e5, 2.05e-7, "GR Region", fontsize=14, fontweight="bold", ha="left")
          ax.text(4.2e5, 1.55e-7, r"$S_{\mathrm{GR}}(f)=\dfrac{B}{1+(f/f_c)^2}$", fontsize=12.5, ha="left",
                  bbox=dict(facecolor="white", edgecolor="none", alpha=0.88, pad=1.8))

          ax.text(2.15e5, 1.06e-7, r"$f_c=1.7\times10^5\ \mathrm{Hz}$", fontsize=11.5, ha="left",
                  bbox=dict(facecolor="white", edgecolor="none", alpha=0.88, pad=1.3))
          ax.text(5.0e4, 6.7e-8, r"$\tau_{\mathrm{eff}}=\dfrac{1}{2\pi f_c}$", fontsize=11.5,
                  ha="left", color="#ff00ff",
                  bbox=dict(facecolor="white", edgecolor="none", alpha=0.82, pad=1.3))

          ax.text(6.0e6, 3.35e-8, "Johnson Region", fontsize=14, fontweight="bold", ha="left")
          ax.text(7.2e6, 2.65e-8, r"$e_J=\sqrt{4k_{\mathrm{B}}TR}$", fontsize=12.5, ha="left",
                  bbox=dict(facecolor="white", edgecolor="none", alpha=0.88, pad=1.5))

          ax.text(3.16e3, 1.17e-8, "typical 1–10 kHz test band", fontsize=10.8,
                  fontweight="bold", ha="center", va="bottom")
          ax.text(1.28e2, 1.045e-8, "Illustrative parameters only.", fontsize=8.4,
                  color="#6f6f6f", ha="left", va="bottom")

          leg = ax.legend(loc="upper right", frameon=True, framealpha=1.0, fontsize=10.5)
          leg.get_frame().set_facecolor("white")
          leg.get_frame().set_edgecolor("#c6c9cc")

          for spine in ax.spines.values():
              spine.set_linewidth(1.0)
          ax.tick_params(axis="both", which="both", labelsize=9.5)
          fig.subplots_adjust(left=0.115, right=0.975, top=0.90, bottom=0.15)

          out = Path("assets/images/mct-noise-spectrum.svg")
          fig.savefig(out, bbox_inches="tight")
          plt.close(fig)

          Path(".github/finalize-mct-equations.trigger").unlink(missing_ok=True)
          Path(".github/workflows/finalize-mct-equations.yml").unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize MCT spectrum equations and positioning"
          git push origin HEAD:agent/finalize-mct-equations-positioning
