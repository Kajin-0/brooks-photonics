name: Publish MCT noise article now

on:
  push:
    branches:
      - fix/publish-mct-noise-now

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/publish-mct-noise-now
          fetch-depth: 0
      - name: Restore approved release files
        run: |
          git fetch origin release/mct-noise-2026-07-29
          git checkout origin/release/mct-noise-2026-07-29 -- \
            posts/how-to-read-photodetector-noise-spectrum.html \
            posts/posts.json \
            posts.html \
            sitemap.xml \
            assets/images/mct-noise-spectrum-social.png
      - name: Set publication date and validate
        run: python scripts/publish_mct_noise_now.py
      - name: Remove one-time publication files
        run: |
          rm scripts/publish_mct_noise_now.py
          rm .github/workflows/publish-mct-noise-now.yml
      - name: Commit publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish HgCdTe noise spectrum article"
          git push origin HEAD:fix/publish-mct-noise-now
