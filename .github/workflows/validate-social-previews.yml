name: Validate social previews

on:
  pull_request:
    paths:
      - "posts/**"
      - "assets/images/**"
      - "scripts/social_previews.py"
      - ".github/workflows/validate-social-previews.yml"
  push:
    branches:
      - main
    paths:
      - "posts/**"
      - "assets/images/**"
      - "scripts/social_previews.py"
      - ".github/workflows/validate-social-previews.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate every post social preview
        run: python scripts/social_previews.py --check
