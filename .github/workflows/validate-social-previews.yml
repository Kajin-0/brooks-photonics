name: Validate social previews

on:
  pull_request:
    paths:
      - "posts/**"
      - "assets/images/**"
      - "scripts/social_previews.py"
      - ".github/workflows/validate-social-previews.yml"
  push:
    branches:
      - main
    paths:
      - "posts/**"
      - "assets/images/**"
      - "scripts/social_previews.py"
      - ".github/workflows/validate-social-previews.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Validate every post social preview
        run: python scripts/social_previews.py --check
