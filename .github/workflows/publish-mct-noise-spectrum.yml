name: Publish MCT noise spectrum article

on:
  push:
    branches:
      - release/publish-mct-noise-spectrum

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/publish-mct-noise-spectrum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rendering dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow cairosvg
      - name: Publish article and regenerate assets
        run: python scripts/publish_mct_noise_spectrum.py
      - name: Remove one-time publication files
        run: |
          rm scripts/publish_mct_noise_spectrum.py
          rm .github/workflows/publish-mct-noise-spectrum.yml
      - name: Commit publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish HgCdTe noise spectrum article"
          git push
