name: Phase 2 clean article URL migration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/phase2-pretty-articles.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Migrate technical articles to clean routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          domain = 'https://brooks-photonics.com'
          slugs = [
              'photoconductor-noise-ratio',
              'how-to-read-photodetector-noise-spectrum',
              'lock-in-noise-enbw',
          ]
          old_sources = {Path('posts') / f'{slug}.html' for slug in slugs}

          main_route_replacements = {
              '../index.html': '/',
              '../about.html': '/about/',
              '../services.html': '/services/',
              '../class.html': '/class/',
              '../utilities.html': '/utilities/',
              '../posts.html': '/posts/',
              '../contact.html': '/contact/',
          }

          def clean_article_text(text: str) -> str:
              for old, new in main_route_replacements.items():
                  text = text.replace(old, new)
              text = text.replace('../assets/', '/assets/')
              for slug in slugs:
                  text = text.replace(
                      f'{domain}/posts/{slug}.html',
                      f'{domain}/posts/{slug}/',
                  )
                  text = text.replace(
                      f'/posts/{slug}.html',
                      f'/posts/{slug}/',
                  )
                  text = text.replace(
                      f'href="{slug}.html"',
                      f'href="/posts/{slug}/"',
                  )
              return text

          # Create the canonical directory pages from the existing articles.
          titles = {}
          for slug in slugs:
              src = Path('posts') / f'{slug}.html'
              if not src.exists():
                  raise SystemExit(f'Missing source article: {src}')
              original = src.read_text(encoding='utf-8')
              title_match = re.search(r'<title>(.*?)</title>', original, re.S | re.I)
              titles[slug] = title_match.group(1).strip() if title_match else slug
              migrated = clean_article_text(original)
              dest = Path('posts') / slug / 'index.html'
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_text(migrated, encoding='utf-8')

          # Update every other HTML/JSON/XML reference to point at the clean routes.
          for pattern in ('*.html', '*.json', '*.xml'):
              for path in Path('.').rglob(pattern):
                  if path in old_sources:
                      continue
                  text = path.read_text(encoding='utf-8')
                  updated = clean_article_text(text)
                  for slug in slugs:
                      updated = updated.replace(
                          f'posts/{slug}.html',
                          f'posts/{slug}/',
                      )
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')

          # Keep posts.json explicit and stable for the post-library renderer.
          posts_json = Path('posts/posts.json')
          data = json.loads(posts_json.read_text(encoding='utf-8'))
          for post in data.get('posts', []):
              file_value = str(post.get('file', ''))
              for slug in slugs:
                  if file_value.rstrip('/') in {
                      f'posts/{slug}.html',
                      f'posts/{slug}',
                      f'/posts/{slug}.html',
                      f'/posts/{slug}',
                  }:
                      post['file'] = f'posts/{slug}/'
          posts_json.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Replace the legacy .html articles with compatibility redirect stubs.
          for slug in slugs:
              target_path = f'/posts/{slug}/'
              canonical = f'{domain}{target_path}'
              title = titles[slug]
              stub = f'''<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8"/>
          <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
          <meta name="robots" content="noindex,follow"/>
          <title>Redirecting - {title}</title>
          <link rel="canonical" href="{canonical}"/>
          <meta http-equiv="refresh" content="0; url={target_path}"/>
          <script>
          (function () {{
            var target = '{target_path}' + window.location.search + window.location.hash;
            window.location.replace(target);
          }})();
          </script>
          </head>
          <body>
          <p><a href="{target_path}">Continue to the article</a></p>
          </body>
          </html>
          '''
              (Path('posts') / f'{slug}.html').write_text(stub, encoding='utf-8')

          # Validation: canonical article pages and metadata must use the clean routes.
          for slug in slugs:
              dest = Path('posts') / slug / 'index.html'
              text = dest.read_text(encoding='utf-8')
              canonical = f'{domain}/posts/{slug}/'
              if canonical not in text:
                  raise SystemExit(f'Canonical route missing from {dest}')
              if f'{domain}/posts/{slug}.html' in text:
                  raise SystemExit(f'Legacy absolute URL remains in {dest}')
              if '../assets/' in text:
                  raise SystemExit(f'Relative asset path remains in {dest}')

              stub = (Path('posts') / f'{slug}.html').read_text(encoding='utf-8')
              if 'noindex,follow' not in stub or canonical not in stub:
                  raise SystemExit(f'Legacy redirect stub is incomplete for {slug}')

          # No public page/data/sitemap other than the redirect stubs may retain the old article URLs.
          for pattern in ('*.html', '*.json', '*.xml'):
              for path in Path('.').rglob(pattern):
                  if path in old_sources:
                      continue
                  text = path.read_text(encoding='utf-8')
                  for slug in slugs:
                      legacy_forms = [
                          f'{domain}/posts/{slug}.html',
                          f'/posts/{slug}.html',
                          f'posts/{slug}.html',
                      ]
                      if any(form in text for form in legacy_forms):
                          raise SystemExit(f'Legacy article URL remains in {path}: {slug}')

          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          for slug in slugs:
              if f'{domain}/posts/{slug}/' not in sitemap:
                  raise SystemExit(f'Clean article route missing from sitemap: {slug}')
              if f'{domain}/posts/{slug}.html' in sitemap:
                  raise SystemExit(f'Legacy article route remains in sitemap: {slug}')

          # Remove this one-time migration workflow before committing the result.
          Path('.github/workflows/phase2-pretty-articles.yml').unlink()
          PY

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate technical articles to clean URLs"
          git push
